      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 2</summary><h2>Introduction</h2><p>Ruth is Frank’s mother.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Writing and ambition</h2><p>She admires Ayn Rand’s work and sends for a test from a New York writers’ school. Frank describes her as beautiful and reports comparisons to Rita Hayworth; these are subjective assessments.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Singing at the funeral</h2><p>At Bobby’s funeral she wears a red satin robe over her black dress. Mrs. Cole has asked her to sing Swing Low, Sweet Chariot. Frank says her singing almost makes him believe in heaven.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Confidence in Ariel’s openness</h2><p>When Nathan expresses concern that something is troubling Ariel, Ruth insists her daughter tells her everything.</p></details><details><summary>Ordinary Grace · Chapter 5</summary><h2>Food for Amelia and concern over college</h2><p>Ruth directs Cadbury’s choir. She and Nathan bring food to Amelia after hearing she is ill, and later discuss the injuries at the Klement home. Ruth suspects Karl is behind Ariel’s reluctance to leave; Ariel denies it.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>Expectations of married life</h2><p>Frank recalls Ruth saying she had expected to marry a lawyer, rather than live as a minister’s wife. She enjoys martinis and sometimes drinks alone in the evening. After Nathan’s search for Travis she thanks him for trying.</p></details><details><summary>Ordinary Grace · Chapter 15</summary><h2>Support and remembered music</h2><p>Nathan defends Ruth’s work on the music programs of three churches and says he would not ask her to change. After rehearsal she and Emil recall music for her sixteenth birthday and his departure two days later. She says she will always love him, distinguishing her present feelings from her love for Nathan in their exchange. She promises he can call when darkness comes and touches his scarred cheek.</p></details><details><summary>Ordinary Grace · Chapter 16</summary><h2>Skepticism and the lunch-table argument</h2><p>Ruth doubts Emil’s sudden change of outlook and describes him as having long felt misunderstood and unappreciated. Ariel’s report of an earlier suicide attempt surprises her; she says Emil never told her. After Ariel leaves Nathan persuades her not to follow, and Ruth returns to the piano.</p></details><details><summary>Ordinary Grace · Chapter 17</summary><h2>Sharing the chorale’s ovation</h2><p>Ruth brings Emil onto the stage, then shares Ariel’s bows after the chorale’s ovation. Later the parents make anxious telephone calls when Ariel has not returned.</p></details><details><summary>Ordinary Grace · Chapter 23</summary><h2>The darkened living room</h2><p>Frank describes Ruth keeping the curtains drawn and often weeping after Ariel’s death. Liz takes over food and the telephone during this period.</p></details><details><summary>Ordinary Grace · Chapter 25</summary><h2>Leaving the breakfast table</h2><p>Ruth leaves angrily for Emil’s house. Jake’s interpretation, later endorsed by Frank, is that she directs anger at God toward Nathan instead; it remains their understanding of her reaction.</p></details><details><summary>Ordinary Grace · Chapter 26</summary><h2>Condemning the Brandts</h2><p>Ruth angrily says the Brandts take what they want and discard what they do not. This is her accusation, not an established account of Karl’s conduct. She insists on joining Nathan’s meeting with Karl and his parents.</p></details><details><summary>Ordinary Grace · Chapter 27</summary><h2>Anger on the porch</h2><p>Ruth’s companionship with Emil falls away as she turns against the family. She smokes on the porch in slippers and a housecoat, her hair unbrushed, and declines to participate in funeral planning. She accuses the county attorney of submission to Axel and treats Karl’s guilt as certain, while Nathan insists it remains unknown. Her quoted battle cry expresses her anger, not a finding about the crime.</p></details><details><summary>Ordinary Grace · Chapter 28</summary><h2>Moonlight above the river</h2><p>Ruth leaves for a walk and is found crying on the trestle. She asks what Frank saw of Ariel, says she frightens herself, and denies that God cares for them. She draws Frank close but accuses Nathan of caring more for God than his family. Before help arrives, she asks Frank to undertake a task without telling his father; its nature is not yet disclosed.</p></details><details><summary>Ordinary Grace · Chapter 29</summary><h2>Music, confrontation and departure</h2><p>Ruth’s secret errand was an envelope placed on Karl’s windshield. She plays its sheet music when he visits, then challenges him about the pregnancy. Julia’s accusations and insults provoke Ruth to recall Julia’s origins and insinuate that Karl was conceived before marriage; these are Ruth’s claims. Afterward Ruth insists the Brandts hide something, threatens to leave if Nathan speaks of God again, and asks Oscar for a place to stay with him and Liz.</p></details><details><summary>Ordinary Grace · Chapter 33</summary><h2>Fragility at the visitation</h2><p>At Ariel’s visitation Ruth appears fragile to Frank. She tells him she will come back but needs time, then takes his hand as she approaches the closed coffin. Frank fears that the family is losing one another.</p></details><details><summary>Ordinary Grace · Chapter 34</summary><h2>A hand after the burial</h2><p>Although Ruth has not returned home after the visitation, she enters the funeral with Nathan on his arm. Afterward she cries in the car, and Nathan, also crying, reaches for her hand.</p></details><details><summary>Ordinary Grace · Chapter 35</summary><h2>Coming home after the grace</h2><p>Ruth asks Nathan for an ordinary grace. When Jake volunteers and falters, she rests a gentle hand on his shoulder; after his fluent prayer her face changes and she thanks him. That night she returns home, leaves the drapes open and goes to bed with Nathan. This return does not end her grief: Frank recalls finding her crying privately for months.</p></details><details><summary>Ordinary Grace · Chapter 36</summary><h2>Sympathy beyond her own family</h2><p>Ruth resumes leading the choir and regrets not speaking to Emil at the funeral. Her heart goes out to Axel and Julia; she wants contact but Emil discourages it. She embraces Emil and says that, though grief hurts terribly, she has survived and believes she will be all right.</p></details><details><summary>Ordinary Grace · Chapter 37</summary><h2>Music in the house again</h2><p>Ruth plays the Moonlight Sonata while Nathan reads on the sofa. Frank realizes how empty the house has felt without music and hesitates to disturb the ordinary evening with his suspicion.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>Packing and parting</h2><p>Ruth clears Ariel’s room slowly and tearfully; most belongings are donated for migrant families. After Emil tells her of the relationship, she and Nathan end social contact with him. Her anger does not last, but Frank does not know whether she forgives him.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>Her final years and resting place</h2><p>Ruth dies of breast cancer at sixty. Nathan cares for her lovingly and does not remarry. She is buried beside Ariel beneath the linden, where the surviving men end their annual visit.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Appearance</h2><p>Ruth has auburn hair and blue eyes; Frank regards her as beautiful.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 5</summary><p><a href="assets/4b7cf967f7c621.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the food delivery at Amelia’s screened doorway (chapter 5).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 15</summary><p><a href="assets/dd89ad0b70b096.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the gesture of support after rehearsal (chapter 15).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 16</summary><p><a href="assets/c1e0599635dc01.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Nathan asking Ruth to give Ariel time to cool down (chapter 16).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 17</summary><p><a href="assets/cc4fbbf4fae190.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Ruth and Ariel’s bows after The Freedom Road (chapter 17).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 27</summary><p><a href="assets/992c42a8ec8c3a.jpg">Open noncanonical illustration</a></p><p>Ruth listens to Gus on the porch before the funeral.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 28</summary><p><a href="assets/becec46fcc5997.jpg">Open noncanonical illustration</a></p><p>Ruth holds Frank beside the moonlit river.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 29</summary><p><a href="assets/2adeb8b84d43ad.jpg">Open noncanonical illustration</a></p><p>Ruth plays the duet once sung by Karl and Ariel.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 34</summary><p><a href="assets/44b127f36fc3f9.jpg">Open noncanonical illustration</a></p><p>Nathan takes Ruth’s hand after the burial.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 35</summary><p><a href="assets/43124d05772dc4.jpg">Open noncanonical illustration</a></p><p>Jake offers the grace with Ruth’s hand on his shoulder.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 2</summary><p><a href="assets/1d62af471ae210.jpg">Open noncanonical illustration</a></p><p>Ruth, Frank’s mother.</p></details></noscript>
