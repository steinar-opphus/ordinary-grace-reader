      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 1</summary><h2>Introduction</h2><p>Doyle is tall and lean.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Appearance</h2><p>Doyle wears a crew cut and has prominent ears.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Accounts from the jail</h2><p>Doyle says he intervened in Gus and Engdahl’s confrontation at Rosie’s while off duty. He relays deputy Jim Gant’s impression that Bobby stayed seated on the tracks as the train approached, while saying that the official finding is an accident. His warning about men drifting along the tracks does not identify anyone as responsible for Bobby’s death.</p></details><details><summary>Ordinary Grace · Chapter 3</summary><h2>Suspicion and pressure at Halderson’s</h2><p>Doyle speculates about someone on the tracks harming Bobby, without supplying new direct evidence. He presses Jake to answer questions, and later grips Frank’s arm painfully when the boys return from the trestle.</p></details><details><summary>Ordinary Grace · Chapter 8</summary><h2>Listening through the duct</h2><p>During the basement poker game Doyle removes rags from the furnace duct to listen to the Sweeneys’ private consultation with Nathan. Gus restores them when he returns.</p></details><details><summary>Ordinary Grace · Chapter 9</summary><h2>Fireworks and cruelty at the river</h2><p>Doyle buys the disapproved fireworks and kills a bullfrog with one, leaving Frank distressed. He also gives allegations about Warren’s past; these are his claims, not independently established history.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>The search at Warren’s shelter</h2><p>After Warren leaves, Frank watches a man rummage in the lean-to and sweep away traces with broken bulrushes. He recognizes Doyle in the flashlight’s light. Frank cannot see what has interested him inside; neither removal nor planting of an object is established.</p></details><details><summary>Ordinary Grace · Chapter 18</summary><h2>Leaving the search downriver</h2><p>After the search party starts back, Doyle hangs behind and heads downriver toward the Flats. His purpose is not stated.</p></details><details><summary>Ordinary Grace · Chapter 19</summary><h2>The locket and his provenance claim</h2><p>Doyle shows the family a locket Nathan identifies as Ariel’s, then says it was in Warren Redstone’s possession. The presentation is witnessed; the recovery location, timing and method are not given in this account.</p></details><details><summary>Ordinary Grace · Chapter 28</summary><h2>The paint can and the threat</h2><p>Doyle stops Frank after a call about activity at the Brandt estate. He collects the discarded paint can and endorses the graffiti as truth, predicting that wealth will protect Karl. Taking Frank home, he says he will hide the can and call him a liar if he speaks about it. The graffiti’s author is not identified by Frank.</p></details><details><summary>Ordinary Grace · Chapter 31</summary><h2>Pressure in the basement</h2><p>Doyle arrives out of uniform and finds the boys beside the furnace duct. He separates them, crowds Jake, and asks whether Karl confessed. Jake reveals Karl’s sexuality; Doyle continues until both boys have disclosed the entire private conversation.</p></details><details><summary>Ordinary Grace · Chapter 33</summary><h2>An unexpected intervention</h2><p>Doyle sits out of uniform in dungarees and a red Hawaiian shirt with yellow flowers, bruising around his right eye and cheek and a swollen lip. He says Gus sucker-punched him. Yet he urges Blake to release Gus to finish the grave, offers to help and returns the motorcycle key. The intervention does not explain away his earlier behavior.</p></details><details><summary>Ordinary Grace · Chapter 36</summary><h2>No charges against Gus</h2><p>Doyle speaks to the chief, and Gus’s case is settled without charges. Gus is able to join the family at church on Sunday.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 8</summary><p><a href="assets/9af9504aca05f2.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the basement poker game and listening through the duct (chapter 8).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 11</summary><p><a href="assets/bc6c4257a2818e.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Frank watching Doyle erase his traces at the shelter (chapter 11).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 19</summary><p><a href="assets/534ec5121bec11.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Doyle showing the locket to the family (chapter 19).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 33</summary><p><a href="assets/f45a27a3273c16.jpg">Open noncanonical illustration</a></p><p>Doyle returns Gus’s motorcycle key for the temporary release.</p></details></noscript>
