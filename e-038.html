      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 7</summary><h2>Introduction</h2><p>Lise Brandt is Emil and Axel’s sister and Karl’s aunt.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Appearance and gardening</h2><p>Frank describes her as tall and plain, working the garden with soiled gloves and a hoe.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Family, gardening and friendship</h2><p>Jake and Lise communicate in signs and gestures and garden together; they watch a released snake move through the sweet corn. Emil says the rest of the family has ignored her and that she has no other friends. Frank’s retrospective suggestion of autism remains tentative and is not a diagnosis.</p></details><details><summary>Ordinary Grace · Chapter 9</summary><h2>Gardening on the fireworks afternoon</h2><p>While watering the flowers Lise wears dungarees, a sleeveless green top, a large straw hat and gardening gloves. This is her outfit in this scene, not a permanent appearance.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>Seeking help and refusing to leave</h2><p>According to Jake’s account, Lise comes to him in distress when Emil is in danger. Jake asks a fireman not to touch her, saying she cannot bear strangers touching her. Later she refuses to leave the hospital, and Nathan asks Jake to help.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>Shared work and an unwanted touch</h2><p>Jake persuades Lise to leave the hospital, and he and Ariel stay with her. She accepts Jake’s help with dishes and later allows Frank to join their gardening. She uses a rock as a fulcrum while levering an embedded boulder with her crowbar.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>Shared work and an unwanted touch</h2><p>When Frank touches her shoulder she swings around with the crowbar. Jake tells Ariel the touch was accidental and says to leave her alone until she calms.</p></details><details><summary>Ordinary Grace · Chapter 16</summary><h2>An interrupted private morning</h2><p>Frank follows an unfamiliar sound and intrudes on Lise’s private ironing, then retreats without announcing himself. Her long brown hair is visible. Later she tells him Ariel has gone driving with Emil.</p></details><details><summary>Ordinary Grace · Chapter 26</summary><h2>Tears in the garden</h2><p>Wearing dungarees and a T-shirt, Lise angrily confronts the boys with a crooked-tined garden tool. Seeing Jake changes her manner: she weeps and lets him hold her, the first time Frank has seen either response. Jake explains that she feels she has lost her brother’s attention and her home since Ariel died. The boys help her garden; this explanation of her feelings is Jake’s.</p></details><details><summary>Ordinary Grace · Chapter 36</summary><h2>Visitors in her sanctuary</h2><p>Lise serves cookies in dungarees, a dark-blue blouse and red slip-ons, looking displeased. Emil says she is content with their sanctuary and someone who needs her; that is his explanation. Her attitude changes when Jake appears, and she invites him to help garden.</p></details><details><summary>Ordinary Grace · Chapter 38</summary><h2>What Emil says she saw</h2><p>During the conversation Lise asks the visitors to leave. Emil later says she had seen Ariel outside his window at night and wanted to chase her away; he asked her not to interfere. He assumes she would have told him of a visit on the last night, but this is his assumption, not a statement from Lise about that night.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>The belongings in the shed</h2><p>While helping build a stone border, Frank finds Ariel’s gold watch and mother-of-pearl barrette in Lise’s shed cabinet. Jake admits having suspected her, reasoning from her strength, dislike of Ariel and possible fear of losing Emil. Lise appears to recognize the items but denies Frank’s accusation. These discoveries and Jake’s reasoning have distinct evidentiary status. When Frank says he will tell Emil, Lise attacks him with the crowbar. Jake intervenes; she throws him off and raises the tool above him, then lowers and drops it without striking, kneels and apologizes. Jake stays beside her as Frank goes to Emil.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>Her account and the years at Saint Peter</h2><p>The epilogue supplies Lise’s account: she found Ariel on the lawn and went to shoo her away. After Ariel touched her, her next memory was holding a bloodied crowbar with Ariel on the ground. She claimed not to remember the actual killing. Panicking, she carried Ariel to the river and put her into the current. Her account contains a memory gap, which the narrator does not fill with a witnessed blow or a diagnosis. Lise spent her remaining life at Minnesota Security Hospital in Saint Peter, lived to nearly seventy, and was not unhappy there, with a garden and private room. Emil visited until his death. Jake remained devoted and prayed beside her at the end. She and Emil lie buried side by side.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>Appearance</h2><p>Her gardening arms are muscular and prominently veined.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Background</h2><p>Ariel’s account says Lise was born deaf, ten years after Emil.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 9</summary><p><a href="assets/ed9483572b42aa.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Lise’s gardening outfit in chapter 9.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 26</summary><p><a href="assets/a4f463e78102de.jpg">Open noncanonical illustration</a></p><p>Lise accepts Jake’s comfort beside the garden.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 39</summary><p><a href="assets/aa6a5c4e47f128.jpg">Open noncanonical illustration</a></p><p>Jake remains beside Lise after she lowers the crowbar.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 7</summary><p><a href="assets/ea133487c10e72.jpg">Open noncanonical illustration</a></p><p>Lise Brandt beside the garden.</p></details></noscript>
