      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 17</summary><h2>The gold heart-shaped locket has a mother-of-pearl inset and is an heirloom Ariel wore at the premiere</h2><p>The gold heart-shaped locket has a mother-of-pearl inset and is an heirloom Ariel wore at the premiere.</p></details><details><summary>Ordinary Grace · Chapter 19</summary><h2>The necklace shown at home</h2><p>Doyle displays a gold heart-shaped locket inset with mother-of-pearl, wrapped in a clean handkerchief. Nathan identifies it as Ariel’s and says she wore it the previous night. Doyle says it was in Warren Redstone’s possession, but gives no recovery circumstances here. Neither that claim nor the object alone establishes responsibility for Ariel’s absence.</p></details><details><summary>Ordinary Grace · Chapter 20</summary><h2>Warren’s explanation</h2><p>Warren says he found the locket upriver and denies seeing Ariel. These are his claims; the account does not independently establish its recovery circumstances.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 17</summary><p><a href="assets/9100c4e7c61b1e.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the closed heirloom locket.</p></details></noscript>
