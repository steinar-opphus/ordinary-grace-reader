      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 5</summary><h2>Introduction</h2><p>Travis Klement operates a small-engine repair business in a converted barn.</p></details><details><summary>Ordinary Grace · Chapter 5</summary><h2>Repair work and the parents’ account</h2><p>Nathan says he struck Amelia, and Ruth says he struck Peter too. Nathan also reports captivity in a North Korean POW camp, continuing nightmares and drinking that Travis believes helps them. This is Nathan’s account, not an independent diagnosis or justification for the violence.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>The promise reported after Mankato</h2><p>Nathan says he and Gus found Travis drinking in a Mankato bar. He reports Travis’s promise that the violence would not recur, while remaining worried for the family. The promise does not establish a lasting change.</p></details><details><summary>Ordinary Grace · Chapter 24</summary><h2>An unexpected response</h2><p>Travis attends the service with Amelia and Peter. After Gus, he answers Nathan’s sermon with an audible Amen. Amelia lays a loving hand on his arm; the moment does not establish a lasting resolution of their difficulties.</p></details><details><summary>Ordinary Grace · Chapter 35</summary><h2>Working on motors with Peter</h2><p>Peter tells Frank that his father is teaching him motor repair and that he enjoys it. This is Peter’s report of their time together.</p></details></noscript>
