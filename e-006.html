      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 1</summary><h2>Story and connections</h2><p>Morris Engdahl is a year older than Frank’s sister, who has just graduated from high school.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Appearance</h2><p>He has black hair styled in a ducktail and favors black leather jackets. His car is a black 1932 Ford Deuce Coupe with suicide doors, chrome grille, whitewall tires and flames painted along the sides.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>In the holding cell</h2><p>He mocks Jake’s stutter in jail. Gus says their fight began after Engdahl insulted Bobby Cole; the account belongs to Gus. Later, Frank smashes the car’s headlights and Jake breaks a rear light.</p></details><details><summary>Ordinary Grace · Chapter 14</summary><h2>The confrontation at the quarry</h2><p>Engdahl’s damaged car lights have been replaced. He is nineteen and has dark blue eyes.</p></details><details><summary>Ordinary Grace · Chapter 14</summary><h2>The confrontation at the quarry</h2><p>He orders the boys away and insults Ariel. Frank charges him into the water; his companion says he cannot swim, and she and Frank pull him back with a branch Jake supplies. Engdahl threatens Frank, then releases him. Frank pushes him in again before escaping with the other boys.</p></details><details><summary>Ordinary Grace · Chapter 19</summary><h2>Questioning and an unverified account</h2><p>Engdahl admits the threats and grabbing Frank. He says he met Judy Kleinschmidt, attended the river party, then left with her for the Mueller place and reached his home near sunrise. His account of speaking to Ariel varies: first possibly, later he does not think so. Gregor holds him while Judy is sought for questioning; this is not corroboration of the account.</p></details><details><summary>Ordinary Grace · Chapter 24</summary><h2>Located in Sioux Falls</h2><p>Doyle reports that Engdahl and Judy have been found at a Sioux Falls motel. Doyle says the local sheriff is holding Engdahl under the Mann Act because Judy is seventeen, and that he will return for questioning. Frank suspects him of killing Ariel; suspicion is not a finding of guilt.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>A fatal fall at the cannery</h2><p>A week before the Drums leave, Engdahl dies after reporting to the cannery drunk, attempting to hit his foreman and falling from a platform, breaking his neck. He is then on bail awaiting the Mann Act hearing. Nathan conducts the burial at his father’s request; Frank attends, but neither his father nor Judy comes to mourn.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 1</summary><p><a href="assets/3fb7e5dc9f232d.jpg">Open noncanonical illustration</a></p><p>Morris Engdahl with ducktail hair and a leather jacket.</p></details></noscript>
