      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Prologue</summary><h2>Introduction</h2><p>Bobby Cole is the narrator’s contemporary, two years behind him at school.</p></details><details><summary>Ordinary Grace · Prologue</summary><h2>Appearance</h2><p>The narrator describes a small boy with golden hair and thick glasses.</p></details><details><summary>Ordinary Grace · Prologue</summary><h2>The remembered summer</h2><p>Bobby dies on the railroad tracks outside New Bremen, Minnesota. The narrator regrets not having been a better friend to him.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Questions raised at the jail</h2><p>Doyle relays Jim Gant’s impression that Bobby did not move from the tracks, but says the official finding remains an accident.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Memories offered at the funeral</h2><p>Frank recalls Bobby’s older parents treating their late-born child with gentle love. Gus remembers Bobby helping care for the cemetery and finding happiness easily; this is Gus’s affectionate account. Frank remembers him rolling clay snakes in first grade.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Frank’s identification of the glasses</h2><p>After meeting Warren again, Frank tells Jake that Warren’s glasses belonged to Bobby. This is Frank’s identification and does not establish how Warren obtained them or explain Bobby’s death.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>An accident in Frank’s judgment</h2><p>The older Frank continues to believe Bobby’s death was an accident, probably connected to his tendency to daydream. That causal explanation remains Frank’s judgment. The family lays flowers at Bobby’s headstone every Memorial Day.</p></details><details><summary>Illustration · Ordinary Grace · Prologue</summary><p><a href="assets/c9a2764082f726.jpg">Open noncanonical illustration</a></p><p>Bobby Cole in his thick glasses.</p></details></noscript>
