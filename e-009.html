      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 1</summary><h2>Introduction</h2><p>Ariel is Frank’s older sister.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Story and connections</h2><p>The retrospective narrator describes her as having a cleft lip.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Coming home at dawn</h2><p>Frank sees her slip into their house through the back door at dawn.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Music and plans for the fall</h2><p>She plays the organ at Bobby’s funeral.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Appearance and the brothers’ confidence</h2><p>She gives a figurative explanation that an angel touched her face. She works at the country-club restaurant south of the Heights.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Appearance and the brothers’ confidence</h2><p>When Jake reveals that two men were under the trestle, she agrees to keep the secret and asks the boys to stay off the tracks.</p></details><details><summary>Ordinary Grace · Chapter 5</summary><h2>Questioning the move to Juilliard</h2><p>Ariel raises Mankato State as an alternative to Juilliard and says she is uncertain about going far from her family. Nathan points to her scholarship. Ruth suspects Karl is the reason, but Ariel denies it; her reason is unresolved. Emil Brandt has taught her for five years.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>Love described as complicated</h2><p>Ariel describes love to Frank as lovely at first, then frightening and complicated. She shakes her head at the idea of marrying Karl and again suggests she might not go away. She reassures Frank that he has remarkable strengths.</p></details><details><summary>Ordinary Grace · Chapter 9</summary><h2>Crying at the piano and helping Frank</h2><p>Frank finds Ariel crying at the upright piano; the cause is not given. She turns to his immediate distress and tells him she will help clean his clothes and that he needs a bath.</p></details><details><summary>Ordinary Grace · Chapter 16</summary><h2>A dispute over knowing Emil</h2><p>Ariel argues that transcribing Emil’s life has given her knowledge of him, calling him both a genius and a wounded man. She discloses the memoir’s account of an earlier attempt and then angrily rejects the performance before leaving.</p></details><details><summary>Ordinary Grace · Chapter 17</summary><h2>The premiere and the late-night absence</h2><p>The Freedom Road receives a standing, cheering ovation after twelve minutes. Ariel wears a red dress, heirloom gold locket inset with mother-of-pearl and mother-of-pearl barrette, and the gold graduation watch from her parents. She bows with Ruth while Emil stays at the piano.</p></details><details><summary>Ordinary Grace · Chapter 17</summary><h2>The premiere and the late-night absence</h2><p>Late that night Nathan says Ariel has not returned. The parents make telephone calls for news; her whereabouts are unknown at this point.</p></details><details><summary>Ordinary Grace · Chapter 18</summary><h2>Searching after the bonfire</h2><p>Karl’s account places Ariel at the river gathering after the singers’ party, but he says he was drunk and assumed she left with someone else. The initial river search yields nothing Gregor regards as significant; Ariel’s whereabouts remain unknown.</p></details><details><summary>Ordinary Grace · Chapter 22</summary><h2>Recognized below the trestle</h2><p>Frank recognizes a red dress in the debris below the trestle and identifies the auburn hair in the water as Ariel’s. He sends Jake for Nathan and remains crying above the river. Recovery and further findings are not described in this chapter.</p></details><details><summary>Ordinary Grace · Chapter 23</summary><h2>Death confirmed and preliminary findings</h2><p>Ariel’s body is retrieved from the river. Doyle reports a preliminary coroner belief that she was struck, likely rendered unconscious and thrown into the water, with a fuller autopsy requested. This is a relayed preliminary finding, not a final determination or identification of a perpetrator.</p></details><details><summary>Ordinary Grace · Chapter 25</summary><h2>Findings of the autopsy</h2><p>Gregor reports head trauma from an elongated instrument, with a tire iron only a possible example. The examiner finds drowning to be the actual cause of death, with silty water in her lungs. Gregor also reports a pregnancy estimated at five or six weeks. Paternity is not established by these findings. Nathan says she and Karl had been dating about a year; he had not known about the pregnancy.</p></details><details><summary>Ordinary Grace · Chapter 31</summary><h2>Karl’s account of her decision</h2><p>Karl says their argument concerned his suggestion of an abortion. According to him, Ariel refused and intended to have the baby and raise it in New Bremen. He says she never identified the father and praises her ability to keep both her own and others’ secrets.</p></details><details><summary>Ordinary Grace · Chapter 38</summary><h2>Emil’s account of their relationship</h2><p>Emil admits a single sexual encounter with Ariel. He says she loved him and talked of marriage, that he tried to discourage her, and that she never told him about the pregnancy. According to him, Lise saw Ariel watching his window at night, and Ariel later promised to stop. His uncertainty about subsequent visits and his reliance on what Lise would have reported leave the last night unestablished by this account.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>The account of her last night</h2><p>Lise’s account places Ariel on the farmhouse lawn the night she died. Ariel touched her, and Lise claimed her next memory was a bloodied crowbar and Ariel on the ground. Lise then carried her into the river current in panic. The memory gap about the blow remains part of that account. Ariel is buried beneath the linden beside Ruth. Nathan intends to join them there.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Appearance</h2><p>Ariel has auburn hair and blue eyes. A scar remains from surgery to correct her cleft lip in infancy.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Personality</h2><p>Frank regards her as a trusted confidante and defender of both brothers.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Background</h2><p>She turns eighteen in May, graduates in June and plans to attend Juilliard in the fall.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 1</summary><p><a href="assets/6278d2982717a0.jpg">Open noncanonical illustration</a></p><p>Ariel, Frank’s older sister.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 17</summary><p><a href="assets/cc4fbbf4fae190.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Ruth and Ariel’s bows after The Freedom Road (chapter 17).</p></details></noscript>
