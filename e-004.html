      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 1</summary><h2>Introduction</h2><p>He is the father of Frank and Jake.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Story and connections</h2><p>Frank and Jake accompany their father to collect Gus from jail.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Care for Gus</h2><p>He took Gus in and found him work after his arrival in New Bremen. Their connection dates to fighting alongside one another in the Second World War. After bringing Gus home, he remains at the church to pray.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Family responses</h2><p>Frank recalls his father describing the wartime bond with Gus as closer than brotherhood.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Leading Bobby’s funeral</h2><p>At the funeral he wears a black Wesley robe and white stole.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Trust and a battlefield memory</h2><p>Nathan restricts the boys to the yard for a week and stresses his need to trust their obedience about the tracks. Sitting on the Packard’s rear bumper at their eye level, he recalls a young German soldier’s body and says he never became used to battlefield death. He offers to listen if they want to talk.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Trust and a battlefield memory</h2><p>He agrees to conduct the itinerant man’s burial. In private he tells Ruth that Ariel seems to have something unspoken on her mind.</p></details><details><summary>Ordinary Grace · Chapter 5</summary><h2>Three congregations and a difficult visit</h2><p>Nathan leads Sunday services for three congregations. Cadbury lies southeast of New Bremen, while Fosburg lies north. After visiting the Klements, he discusses Travis’s violence, captivity and nightmares with Ruth, then goes to get Gus. Ruth says Nathan has nightmares himself but does not drink.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>His father and the church on the Flats</h2><p>Nathan’s father drank and struck his wife and son, and later died when a coal carrier sank off Nova Scotia. Nathan’s church on the Flats is Third Avenue Methodist Church.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Words at the burial</h2><p>At the itinerant man’s burial Nathan reads the Twenty-Third Psalm and Romans.</p></details><details><summary>Ordinary Grace · Chapter 8</summary><h2>Counseling and an unexpected question</h2><p>Nathan offers the Sweeneys a referral to Jerry Stowe, a clergy friend specializing in physical-intimacy counseling. Later he asks Frank whether Gus was winning, surprising him.</p></details><details><summary>Ordinary Grace · Chapter 9</summary><h2>Startlement and wartime gossip</h2><p>Frank observes Nathan becoming tense and watchful at fireworks sounds. Gus attributes this to the war and calls Nathan a fine officer. Doyle says he heard Nathan cracked; Gus dismisses it as gossip. No clinical conclusion is established.</p></details><details><summary>Ordinary Grace · Chapter 19</summary><h2>An acknowledged debt to Gus</h2><p>Frank recalls Nathan telling Ruth that he owes Gus his life. The circumstances are not explained to Frank.</p></details><details><summary>Ordinary Grace · Chapter 22</summary><h2>Condemning the harassment</h2><p>Nathan reports threats against the O’Keefes and damage to their window, and says he will apologize for others’ ignorance. He challenges Oscar’s generalization and calls the harassment prejudice using Ariel’s absence as an excuse.</p></details><details><summary>Ordinary Grace · Chapter 22</summary><h2>Prayer during the wait</h2><p>Nathan prays alone and with the family. Frank says Ruth does not join these prayers; this describes her response during the waiting, not a permanent statement about her beliefs.</p></details><details><summary>Ordinary Grace · Chapter 23</summary><h2>Self-blame and comfort at the altar</h2><p>Nathan finds comfort in the Bible, while Ruth asks him to read it elsewhere. Later he kneels before the church altar and tells Gus he fears his sins are causing the family’s suffering. This is his anguished interpretation, not an established cause. Gus rejects it and holds him as he sobs.</p></details><details><summary>Ordinary Grace · Chapter 24</summary><h2>A sermon in grief</h2><p>Nathan insists on preaching at Third Avenue Methodist. He openly admits heartbreak and incomprehension, then urges faith, hope and love. The promised miracle is being able to see the beauty of a day again.</p></details><details><summary>Ordinary Grace · Chapter 26</summary><h2>Resisting a rush to judgment</h2><p>Nathan plans with Ruth to meet Karl and his parents. He reminds Frank that Karl’s involvement is unproven and asks both boys to avoid judgments and rumors. Asked about his own killings, Nathan says he would undo them if he could, without explaining the incidents. He admits uncertainty but maintains his trust in God.</p></details><details><summary>Ordinary Grace · Chapter 27</summary><h2>Blocked attempts at discussion</h2><p>Nathan and Ruth cannot secure a meeting with the Brandts and are refused entry. He arranges Ariel’s Saturday burial and continues to caution that Karl’s part in her death remains unknown.</p></details><details><summary>Ordinary Grace · Chapter 29</summary><h2>An argument at the heart of faith</h2><p>Nathan assures Karl he never thought him Ariel’s killer and is dismayed by the town’s treatment of the Brandts. When Ruth threatens to leave if he mentions God again, he says God is at the heart of everything for him. She calls Oscar to arrange a stay away from home.</p></details><details><summary>Ordinary Grace · Chapter 30</summary><h2>A beer at the kitchen table</h2><p>After Ruth leaves, Nathan tells the boys she needs time and goes to his office. Gus later prepares dinner and offers him a beer despite his religious rule. Nathan joins the meal and drinks; the group enjoys a brief respite together.</p></details><details><summary>Ordinary Grace · Chapter 31</summary><h2>Receiving Karl’s confidence</h2><p>When Karl discloses his sexuality and shame, Nathan tells him he is neither sick nor a freak, that God loves him, and that he has never believed him Ariel’s killer. He promises not to repeat Karl’s confidence.</p></details><details><summary>Ordinary Grace · Chapter 32</summary><h2>The confidence made public</h2><p>The boys confess the furnace-duct eavesdropping and Doyle’s questioning. Nathan is unhappy but postpones dealing with their conduct to go and speak to Karl.</p></details><details><summary>Ordinary Grace · Chapter 34</summary><h2>Sharing the farewell</h2><p>Nathan arranges the funeral with Conrad Stephens presiding. The family enters together, Ruth holding his arm. After the burial Nathan and Ruth both cry in the car and he reaches for her hand.</p></details><details><summary>Ordinary Grace · Chapter 35</summary><h2>Making room for another voice</h2><p>After Ruth asks for an ordinary grace, Nathan invites someone else to offer the blessing. Jake volunteers and delivers a short fluent prayer after an initial stumble. Nathan appears almost happy, and Ruth returns home that night.</p></details><details><summary>Ordinary Grace · Chapter 37</summary><h2>Only part of the story</h2><p>Nathan hears Frank’s accusation and decides to speak to Emil, taking Frank under a promise of silence. He cautions that the theory may make sense but does not fit the depth of violence he has known in Emil; they may know only part of the story. His view of Emil’s character is a reason for caution, not proof of innocence. He sends Gus and Jake to Ruth and asks them not to reveal where he has gone.</p></details><details><summary>Ordinary Grace · Chapter 38</summary><h2>Forgiveness and a future elsewhere</h2><p>Nathan directly questions Emil, believes his denial of killing Ariel, but says he will pray for forgiveness while having no wish to see him again. He insists Emil tell Ruth himself. Later he tells Frank he will accept a pastorate in Saint Paul and move before school starts; Ruth already knows. When Frank confesses letting Warren escape, Nathan holds him rather than condemns him and says he is ready to be done with anger.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>Care, memory and old age</h2><p>Nathan cares lovingly for Ruth until her death and never remarries. In the present he lives in Saint Paul, is well over eighty, frail and troubled by his heart, trembling hands and concentration. He joins his sons on their yearly cemetery visit, insisting on flowers even for Engdahl. The wartime incident involving him and Gus remains unexplained. At the graves he calls it a good life, and intends eventually to join Ruth and Ariel beneath the linden.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Appearance</h2><p>Nathan has brown eyes.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Personality</h2><p>Frank describes his preaching as earnest and thoughtful, rather than theatrical.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Background</h2><p>He grew up in Duluth, finished law school in 1942, and entered seminary after wartime service rather than practicing law.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 23</summary><p><a href="assets/38c9039fa73ef6.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Gus comforting Nathan at the altar (chapter 23).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 24</summary><p><a href="assets/4abdaf895991c6.jpg">Open noncanonical illustration</a></p><p>Nathan addresses the congregation on the Sunday after Ariel’s death.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 31</summary><p><a href="assets/f41682de36c9ed.jpg">Open noncanonical illustration</a></p><p>Nathan listens compassionately to Karl’s private disclosure.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 34</summary><p><a href="assets/44b127f36fc3f9.jpg">Open noncanonical illustration</a></p><p>Nathan takes Ruth’s hand after the burial.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 38</summary><p><a href="assets/deef02bb55dab4.jpg">Open noncanonical illustration</a></p><p>Nathan reassures Frank after his confession.</p></details><details><summary>Illustration · Ordinary Grace · Epilogue</summary><p><a href="assets/a0897ea74b2afc.jpg">Open noncanonical illustration</a></p><p>Frank, Nathan and Jake share the annual cemetery visit.</p></details></noscript>
