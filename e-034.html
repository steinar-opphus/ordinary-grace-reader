      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 6</summary><h2>Introduction</h2><p>Julia Brandt is Karl’s mother.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>Appearance</h2><p>She has black hair and dark eyes.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>In the hospital waiting area</h2><p>She says it is fortunate Ariel and Karl still have one another for comfort before leaving. Ruth replies that Emil’s survival is the only fortunate thing. Julia also recalls expectations that Ruth might have married Emil.</p></details><details><summary>Ordinary Grace · Chapter 27</summary><h2>Seclusion with Karl</h2><p>Julia and Axel keep Karl from public view; Nathan and Ruth are unable to obtain the meeting they seek.</p></details><details><summary>Ordinary Grace · Chapter 29</summary><h2>Hostility in the Drums’ living room</h2><p>Julia intervenes between Karl and Ruth and sends Karl home. She insists he neither killed nor impregnated Ariel, yet accuses Ariel of conceiving to force marriage. She says the family would never have allowed it, citing insulting judgments about the Drum children and hypothetical descendants. These are Julia’s assertions and prejudices, not evidence of Ariel’s motives or hereditary risk. Axel apologizes and takes her home.</p></details><details><summary>Ordinary Grace · Chapter 36</summary><h2>Emil’s report of her distress</h2><p>Emil says Axel reports Julia threatening suicide and being heavily sedated. This is information conveyed through Emil, not a directly observed assessment or a diagnosis.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>Raising Sam</h2><p>Julia and Axel adopt and raise Sam, a boy from Korea, and will the brewery to him. He occupies the family mansion in the present.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 6</summary><p><a href="assets/7d75dc7ca940e9.jpg">Open noncanonical illustration</a></p><p>Julia Brandt, Karl’s mother.</p></details></noscript>
