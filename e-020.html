      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 3</summary><h2>Appearance</h2><p>Frank identifies the stranger as Indigenous. He has gray hair and wears dirty khakis and a sleeveless undershirt. He says he fought in the First World War.</p></details><details><summary>Ordinary Grace · Chapter 3</summary><h2>The man beside the river</h2><p>The stranger searches Skipper’s pockets and says he saw him collapse while talking; heart attack and stroke are his guesses, not a diagnosis. He says he does not know Skipper’s real name. After he touches Jake’s leg, Frank pulls Jake away. The man calls after them that he meant nothing by it; his intention remains unestablished.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Recognized as Warren</h2><p>Danny identifies his great-uncle as Warren, and Frank and Jake recognize him as the stranger they met beside the dead man. Danny says Warren returned last week and his mother took him in.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Recognized as Warren</h2><p>Warren has thick-lensed, apparently gold-rimmed glasses, which he uses as a magnifier to read a letter before crumpling it and throwing it away. Afterwards Frank tells Jake they belonged to Bobby Cole; the ownership remains Frank’s claim, with no established explanation or attribution of responsibility.</p></details><details><summary>Ordinary Grace · Chapter 9</summary><h2>Doyle’s account of Warren Redstone</h2><p>Doyle gives Warren’s surname as Redstone, says police are watching him, and alleges earlier trouble over an attempted Sioux uprising and federal authorities. He also says he understands the FBI has no current interest. These remain Doyle’s reported claims and do not establish involvement in either death.</p></details><details><summary>Ordinary Grace · Chapter 13</summary><h2>Clean clothes and an account of responsibility</h2><p>At the O’Keefes’ house Warren wears a clean plaid shirt, chinos and loafers, with his hair neatly combed. His eyes are dark; Frank sees him as tall and powerful and estimates his age at least sixty.</p></details><details><summary>Ordinary Grace · Chapter 13</summary><h2>Clean clothes and an account of responsibility</h2><p>Frank asks about the photograph as an aid to identifying the dead man. Warren asks whether he would give it to police. He translates Wo iyokihi as responsibility and says he was jailed for contesting distorted history. His account emphasizes starvation and broken promises before the 1862 fighting and the execution of thirty-eight warriors; these statements are Warren’s account as heard by Frank, whose schooling offered a different version.</p></details><details><summary>Ordinary Grace · Chapter 17</summary><h2>Standing between Frank and Engdahl</h2><p>When Engdahl tries to pull Frank away from the crowd, Warren breaks his grip and intervenes. He tells Engdahl he must pass him to reach the boy. Engdahl retreats with another threat.</p></details><details><summary>Ordinary Grace · Chapter 20</summary><h2>The missing tin and the storm</h2><p>Warren holds Jake when the boys return to the shelter, accuses them of theft and asks for his missing can. He releases Jake at Frank’s demand. He denies seeing Ariel and says he found the locket upriver. His explanation is that the objects were found or given to him and are meaningful pieces of his life.</p></details><details><summary>Ordinary Grace · Chapter 20</summary><h2>The missing tin and the storm</h2><p>When Frank calls out his location as sirens approach, Warren tells him he has killed him and runs. This is his statement, not evidence of a death in this chapter.</p></details><details><summary>Ordinary Grace · Chapter 21</summary><h2>The silent meeting above the ties</h2><p>Frank finds Warren lying silently on the trestle, looking down through the crossties. His eyes are brown. Warren rises, crosses carefully, looks back once and disappears into the rain. His escape does not resolve the locket’s provenance or Ariel’s whereabouts.</p></details><details><summary>Ordinary Grace · Chapter 25</summary><h2>The sheriff reconsiders</h2><p>Gregor says Warren’s record contains no violence and the objects found at his camp could plausibly have been picked up. He now has little feeling that Warren was responsible for Ariel’s death; this is a change in suspicion, not a completed finding.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>The accusation falls away for Frank</h2><p>Finding Ariel’s belongings in Lise’s shed changes Frank’s understanding. He argues that Warren’s continued pursuit could expose an innocent man to harm and feels his guilt over the escape lift. At this point this records the discovery and Frank’s conclusion, not a completed legal investigation.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>A later meeting by the river</h2><p>While at the University of Minnesota, Frank meets Danny again and learns Warren has returned near Granite Falls. Visiting him fishing, Frank recognizes his earlier condemnation as wrong. Warren now wears a wide round-brimmed black hat with a colourful band and two long gray braids. Warren says he stayed with family on the Rosebud reservation and thanks Frank for his silence at the trestle, believing it saved his life from police. Frank does not necessarily share that belief. Warren’s parting observation—that the dead are no more than a breath away—stays with him.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 3</summary><p><a href="assets/44d5820db7060d.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the photograph encounter beneath the trestle (chapter 3).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 7</summary><p><a href="assets/814b7e14b9f260.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Warren reading through the glasses (chapter 7).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 13</summary><p><a href="assets/24a91e2fd0039f.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Warren’s clean clothes and full stature in chapter 13.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 20</summary><p><a href="assets/8c7bdca6920c17.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the pause after Jake’s release in the storm (chapter 20).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 21</summary><p><a href="assets/e132dba2a1bc68.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the silent meeting at the trestle (chapter 21).</p></details><details><summary>Illustration · Ordinary Grace · Epilogue</summary><p><a href="assets/49854b06801e7c.jpg">Open noncanonical illustration</a></p><p>Warren fishing at the later reunion with Frank.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 3</summary><p><a href="assets/b567703df61052.jpg">Open noncanonical illustration</a></p><p>The gray-haired stranger beside the river.</p></details></noscript>
