      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 5</summary><h2>Introduction</h2><p>Karl is Ariel’s boyfriend.</p></details><details><summary>Ordinary Grace · Chapter 5</summary><h2>Ariel’s boyfriend</h2><p>Ruth calls Karl Ariel’s boyfriend and suspects he is the reason Ariel hesitates about leaving for college. Ariel denies this explanation.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>The Brandt family and college plans</h2><p>Karl is Axel and Julia Brandt’s only child. His father owns the brewery. Frank describes him as polite, funny and successful at three sports. His parents gave him a red Triumph TR3 for his eighteenth birthday.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>The Brandt family and college plans</h2><p>Karl and Ariel have gone steady for almost a year after Ruth cast them together in The Boy Friend. He plans to attend St. Olaf’s, play football, earn a degree and return to the brewery. His family keeps boats at Lake Singleton.</p></details><details><summary>Ordinary Grace · Chapter 15</summary><h2>Declining Frank’s questions</h2><p>Karl gives the brothers a ride, then tells Frank that he and Ariel have not discussed marriage. He declines to discuss Ariel’s reasons for reconsidering college, calling it private between them.</p></details><details><summary>Ordinary Grace · Chapter 18</summary><h2>The bonfire account</h2><p>Karl says he took Ariel to the river gathering after the singers’ party. He reports being drunk, assuming she found another ride, and leaving around two or two-thirty. His account is testimony, not a complete established timeline of Ariel’s movements.</p></details><details><summary>Ordinary Grace · Chapter 18</summary><h2>The bonfire account</h2><p>Karl also answers yes when asked whether Ariel was drinking.</p></details><details><summary>Ordinary Grace · Chapter 25</summary><h2>Questions after the autopsy</h2><p>Gregor turns toward questioning Karl after learning of Ariel’s pregnancy. He reports friends witnessed a large argument the day before she disappeared, without knowing its subject. Frank’s claim that Karl loved her less is his impression, not established knowledge. Neither these suspicions nor the pregnancy establish Karl’s paternity or guilt.</p></details><details><summary>Ordinary Grace · Chapter 27</summary><h2>Behind the mansion’s doors</h2><p>Axel and Julia keep Karl out of public view. The sheriff reports that Karl neither confirms nor denies responsibility for the pregnancy, denies marriage plans and repeats his account of losing track of Ariel while drunk. A lawyer attends each interview. The sheriff considers the answers rehearsed; that impression does not establish guilt.</p></details><details><summary>Ordinary Grace · Chapter 29</summary><h2>The envelope and the song</h2><p>Karl brings Ruth’s envelope to the Drums’ home. It contains sheet music for Unforgettable, which Ruth sings; Karl and Ariel had performed it together in spring. Frank sees his vulnerability anew. Karl denies killing Ariel or sleeping with her, and calls his claims to friends mere talk he regrets. His parents send him home despite his wish to explain.</p></details><details><summary>Ordinary Grace · Chapter 31</summary><h2>A confidence entrusted to Nathan</h2><p>Karl privately reveals that he is gay and has spent his life imitating other boys to hide his difference. He says he has told nobody, not even Ariel, although he thinks she understood. Nathan rejects his self-condemnation and affirms that he is loved by God. Karl calls Ariel his best friend and says he did not father her child. He explains that their argument concerned his suggestion of an abortion in Rochester; according to him she refused and planned to raise the child in New Bremen, without naming the father. He trusts Nathan to keep his confidence, and Nathan promises to do so.</p></details><details><summary>Ordinary Grace · Chapter 33</summary><h2>News in the night</h2><p>After a nighttime call from the sheriff, Nathan tells Frank that Karl is dead. The news supplies no cause or circumstances at this chapter.</p></details><details><summary>Ordinary Grace · Chapter 34</summary><h2>The crash and its uncertainty</h2><p>Karl has driven the Triumph too fast into a cottonwood at a bend after drinking his father’s scotch. There is no sign he attempted the turn. Frank reports that no one can say whether the tragedy was an accident or intentional; neither the crash nor the surrounding disclosure establishes intent.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>Appearance</h2><p>Karl is tall and blond.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 29</summary><p><a href="assets/2adeb8b84d43ad.jpg">Open noncanonical illustration</a></p><p>Ruth plays the duet once sung by Karl and Ariel.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 31</summary><p><a href="assets/f41682de36c9ed.jpg">Open noncanonical illustration</a></p><p>Nathan listens compassionately to Karl’s private disclosure.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 5</summary><p><a href="assets/8f912810c91d79.jpg">Open noncanonical illustration</a></p><p>Karl, Ariel’s boyfriend.</p></details></noscript>
