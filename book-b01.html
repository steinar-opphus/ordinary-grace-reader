      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Prologue</summary><h2>Introduction</h2><p>The narrator remembers a childhood summer marked by loss and by questions about suffering and wisdom.</p></details><details><summary>Ordinary Grace · Prologue</summary><h2>Prologue</h2><p>The retrospective narrator recalls Bobby Cole’s death on the railroad outside New Bremen. He regrets not having been a better friend to the boy. Looking back four decades later, he frames the summer through several forms of death and his father’s remembered association between suffering and wisdom.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Chapter 1</h2><p>On a hot night before July 1961, thirteen-year-old Frank and his younger brother Jake accompany their father to the New Bremen jail to collect Gus. Officer Doyle reports deputy Jim Gant’s impression that Bobby Cole did not move from the tracks, although the death is officially considered an accident.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Chapter 1</h2><p>Morris Engdahl mocks Jake’s stutter. Walking home, Frank smashes Engdahl’s headlights, and Jake eventually joins in by breaking a rear light. Back at the church, Gus falls asleep after blaming the man he calls Captain for unspecified deaths. Their father stays to pray, while Frank sees his older sister sneak home at dawn.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Chapter 2</h2><p>At breakfast, Ruth works on writing exercises. Frank tears Jake’s suit coat while pulling him away from the Sweeneys’ fence, then repairs it with sewing skills learned as a Scout.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Chapter 2</h2><p>At Bobby Cole’s funeral, Ariel plays the organ and Ruth’s singing almost makes Frank believe in heaven. Gus approaches the coffin in tears and remembers Bobby helping in the cemetery, finding happiness easily, and enduring hurtful mockery. Frank recalls Bobby making clay snakes in class but does not speak at the service.</p></details><details><summary>Ordinary Grace · Chapter 3</summary><h2>Chapter 3</h2><p>After yard work, Frank and Jake visit Halderson’s Drugstore, where Doyle repeats his suspicions about Bobby’s death and pressures Jake to answer questions. The boys later walk to the river trestle, the site of Bobby’s death, and encounter a stranger beside a man he says is dead.</p></details><details><summary>Ordinary Grace · Chapter 3</summary><h2>Chapter 3</h2><p>The stranger says the man called himself Skipper and had collapsed while talking; the cause and true identity remain unknown. A photograph bears a 1944 birthday message signed Mary. Frank becomes frightened when the stranger puts his hand on Jake’s leg and pulls his brother away. Back at the drugstore, Doyle grips Frank’s arm painfully, and Jake explains that they have seen a dead man.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Chapter 4</h2><p>After questioning by Sheriff Gregor, Frank has concealed the stranger’s presence. Nathan confines the boys to the yard for a week, explains his need for trust, recalls never becoming used to battlefield death, and offers to listen.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Chapter 4</h2><p>Jake says the stranger would not have hurt them and calls Frank his best friend. He reveals the second man to Ariel, who agrees to keep the secret but asks both boys to avoid the tracks. Nathan agrees to conduct the itinerant man’s burial. Later Frank watches a passing electrical storm and sees someone leave toward the Heights.</p></details><details><summary>Ordinary Grace · Chapter 5</summary><h2>Chapter 5</h2><p>After Amelia and Peter Klement miss church, Ruth hears that Amelia is ill. Ariel questions leaving for Juilliard and suggests Mankato State. Ruth suspects Karl, whom she calls Ariel’s boyfriend, but Ariel denies that explanation and speaks of staying near her family.</p></details><details><summary>Ordinary Grace · Chapter 5</summary><h2>Chapter 5</h2><p>The family takes food to the Klements. Amelia opens the screen door only a little, and Frank notices Peter’s black eye. Back home, Nathan says Travis hit Amelia; Ruth says Peter was hit too. Nathan describes Travis’s captivity and nightmares, while Ruth points out Nathan’s own nightmares and abstinence. Nathan goes to get Gus.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>Chapter 6</h2><p>Karl Brandt takes Ariel out in his car. Their relationship has lasted almost a year; he is the only child of brewery owner Axel and Julia Brandt. On the porch Ariel tells Frank love is complicated, shakes her head at marrying Karl and again suggests she may not leave.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>Chapter 6</h2><p>Frank adds invented voices to his account of the discovery, and Jake objects that his own role is disappearing from the story. Late that night Nathan reports finding Travis in a Mankato bar. Travis has promised not to repeat the violence, but Nathan remains concerned for the family. Ruth thanks him for trying.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Chapter 7</h2><p>At Emil and Lise Brandt’s home, Ariel works on the dictated memoir, Nathan plays chess with Emil, and Jake gardens with Lise and releases a snake. Emil calls Ariel a gifted composer; Nathan says he wants her happiness.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Chapter 7</h2><p>Frank attends the itinerant man’s burial, helping remove the coffin’s support boards while Gus later fills the grave. Afterwards the boys join Danny’s search and recognize his great-uncle Warren as the stranger from the trestle. Warren reads a letter through thick, apparently gold-rimmed glasses and throws the letter aside. At home, Frank tells Jake the glasses belonged to Bobby Cole; this is Frank’s identification, not an established explanation of Bobby’s death.</p></details><details><summary>Ordinary Grace · Chapter 8</summary><h2>Chapter 8</h2><p>After dinner with Liz and their grandfather, Frank and Jake seek Gus’s advice about the glasses but find a poker game in the church basement. Doyle removes rags from a duct to overhear the Sweeneys’ private consultation with Nathan. The couple discuss conflicting needs; Nathan suggests specialist counseling, and Avis agrees.</p></details><details><summary>Ordinary Grace · Chapter 8</summary><h2>Chapter 8</h2><p>Gus stops the eavesdropping on returning from the bathroom. The boys get no advice about the glasses. Frank is thrilled by inclusion in the men’s confidence, while Jake objects to the invasion of privacy. Frank decides to keep Warren’s involvement secret. Later Nathan surprises him by asking whether Gus was winning.</p></details><details><summary>Ordinary Grace · Chapter 9</summary><h2>Chapter 9</h2><p>Jake refuses the outing with Gus and Doyle, but Frank goes. Doyle buys fireworks that Nathan would not approve and later offers new allegations about Warren Redstone. His account of Warren’s past remains a police claim.</p></details><details><summary>Ordinary Grace · Chapter 9</summary><h2>Chapter 9</h2><p>At Sibley Park, Doyle kills a frog with a firecracker. Frank leaves in tears, then finds Ariel crying at home; she turns to helping him clean up. Later Gus apologizes, accepts responsibility and cautions Frank that gossip cannot tell Nathan’s own wartime truth. Frank says he no longer wants fireworks.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>Chapter 10</h2><p>While Jake stays home, Lise comes for help, and Gus takes them to Emil’s home. Gus later tells Nathan that Emil has attempted suicide. The account relayed through Jake includes a fireman’s suspicion about sleeping pills.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>Chapter 10</h2><p>Frank exaggerates Jake’s rescue role at church; Jake demands the truth, swears and flees, and Frank later apologizes. When Lise will not leave the hospital, Nathan asks Jake to help. Jake agrees and walks toward Emil’s room between Nathan and Axel, with Ariel pleading that Emil needs rest. In the waiting area Ruth rejects Julia’s claim that anything about the crisis is fortunate except Emil’s survival.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>Chapter 11</h2><p>Jake persuades Lise to leave the hospital; he and Ariel agree to stay with her. At the farmhouse, Frank helps Jake and Lise free a boulder from the garden, using digging tools and a crowbar lever. When he touches her shoulder in celebration, she swings around with the crowbar; Jake explains the touch was accidental and asks that she be given time to calm.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>Chapter 11</h2><p>Frank leaves through the rear gate. Later, after seeing Warren head toward Danny’s house, he watches a man rummage in the lean-to and sweep away his traces with reeds. The flashlight reveals Doyle’s face, but Frank cannot tell what interested him inside.</p></details><details><summary>Ordinary Grace · Chapter 12</summary><h2>Chapter 12</h2><p>Emil returns from hospital and tells Ariel the incident was accidental. Privately, after Nathan questions that account, he says he lacks the courage to try again but leaves the underlying reason unexplained.</p></details><details><summary>Ordinary Grace · Chapter 12</summary><h2>Chapter 12</h2><p>At Warren’s deserted shelter, Frank uncovers a tin of small objects, including glasses he identifies as Bobby’s and the photograph from the dead man’s coat. Jake asks whether the objects were found; their acquisition remains unknown. Frank replaces and reburies the tin, then sweeps away their tracks.</p></details><details><summary>Ordinary Grace · Chapter 13</summary><h2>Chapter 13</h2><p>After losing at Risk, Frank joins Warren downstairs and asks about the photograph as a possible means of identifying the dead man. Warren asks whether Frank would give it to police, then explains his own imprisonment through responsibility to contest distorted accounts of Dakota history.</p></details><details><summary>Ordinary Grace · Chapter 13</summary><h2>Chapter 13</h2><p>Warren’s account of the 1862 conflict differs from Frank’s schooling. Frank challenges the idea of imprisonment for speaking out, and Warren responds before ending the conversation.</p></details><details><summary>Ordinary Grace · Chapter 14</summary><h2>Chapter 14</h2><p>At the quarry, Engdahl orders the boys away and insults Ariel. Frank charges him and both fall into the water. When his companion says he cannot swim, Jake provides a branch and Frank and the companion pull him to the rock.</p></details><details><summary>Ordinary Grace · Chapter 14</summary><h2>Chapter 14</h2><p>Engdahl grabs Frank and threatens to kill him, then releases him after the companion intervenes. Frank pushes him into the water again. The boys flee and hide with their bicycles behind spoil rock while Engdahl drives past without finding them.</p></details><details><summary>Ordinary Grace · Chapter 15</summary><h2>Chapter 15</h2><p>Father Peter relays parish gossip about Ruth, while Nathan defends her musical work and says he would not ask her to change. Later Karl gives the boys a ride. He tells Frank that he and Ariel have not discussed marriage and that their college discussion is private.</p></details><details><summary>Ordinary Grace · Chapter 15</summary><h2>Chapter 15</h2><p>At the rehearsal, Emil is back at the piano. After the others leave, Frank overhears Ruth and Emil recall her sixteenth-birthday music and his departure for New York. They express love, with Ruth distinguishing her present feelings and promising support in his darkness; Frank sees their hands together at his scarred cheek.</p></details><details><summary>Ordinary Grace · Chapter 16</summary><h2>Chapter 16</h2><p>On Independence Day Ruth sends Frank for Ariel, while Jake carries performance information for the newspaper. At the house Frank follows an unfamiliar sound, intrudes on Lise’s private ironing and quietly withdraws. She later tells him Ariel is driving with Emil.</p></details><details><summary>Ordinary Grace · Chapter 16</summary><h2>Chapter 16</h2><p>At lunch Ariel reports Emil’s renewed wish to compose. Ruth remains skeptical, and their disagreement grows into a dispute over how well each knows him. Ariel says the memoir records an earlier suicide attempt, which Ruth had not known about. Ariel swears and leaves; Nathan persuades Ruth to give her time to cool down.</p></details><details><summary>Ordinary Grace · Chapter 17</summary><h2>Chapter 17</h2><p>At the Independence Day celebration, Engdahl tries to pull Frank away from the crowd. Warren breaks his grip and stands between them; Engdahl retreats with another threat.</p></details><details><summary>Ordinary Grace · Chapter 17</summary><h2>Chapter 17</h2><p>Ariel’s chorale, The Freedom Road, receives a standing ovation. Ruth and Ariel bow while Emil remains at the piano. Later that night Nathan says Ariel has not come home, and the parents continue calling for news while Frank returns to bed.</p></details><details><summary>Ordinary Grace · Chapter 18</summary><h2>Chapter 18</h2><p>Gregor interviews the family and Karl, who says he was drunk and assumed Ariel had found another ride. He estimates leaving around two or two-thirty. Ruth’s calls have not located Ariel, and she remains by the phone while the search moves to Sibley Park.</p></details><details><summary>Ordinary Grace · Chapter 18</summary><h2>Chapter 18</h2><p>At Jake’s urging, Frank tells the sheriff about Engdahl’s behavior and insults. The search finds nothing Gregor considers significant; he plans to question Engdahl and take the boys’ statements. Doyle hangs back and heads downriver toward the Flats.</p></details><details><summary>Ordinary Grace · Chapter 19</summary><h2>Chapter 19</h2><p>Townspeople offer help, and the family goes to hear Engdahl questioned. He admits threats and grabbing Frank, places himself at the river party, and gives an account involving Judy Kleinschmidt and the Mueller property. His statements about speaking to Ariel shift from possible conversation to thinking he said nothing. Gregor keeps him while Judy is sought.</p></details><details><summary>Ordinary Grace · Chapter 19</summary><h2>Chapter 19</h2><p>At home Doyle shows a heart-shaped locket, which Nathan identifies as Ariel’s. Doyle says it was in Warren Redstone’s possession; the recovery circumstances are not supplied.</p></details><details><summary>Ordinary Grace · Chapter 20</summary><h2>Chapter 20</h2><p>Emil comes to wait with Ruth, and Karl leaves quickly after hearing about the locket. The boys return to Warren’s shelter, where Frank discovers the tin missing and finds Jake in Warren’s grip.</p></details><details><summary>Ordinary Grace · Chapter 20</summary><h2>Chapter 20</h2><p>Warren releases Jake, denies seeing Ariel, and says he found the locket upriver. He says the collected objects were found or given to him. As the storm breaks and sirens approach, Frank calls out Warren’s location. Warren tells him he has killed him and runs; the words do not establish an actual death.</p></details><details><summary>Ordinary Grace · Chapter 21</summary><h2>Chapter 21</h2><p>The adults arrive and pursue Warren after Doyle points downriver. Nathan tells the boys to wait at the car, but Frank, regretting his anger and agreeing with Jake’s belief that Warren did not hurt Ariel, follows the pursuit.</p></details><details><summary>Ordinary Grace · Chapter 21</summary><h2>Chapter 21</h2><p>At the trestle, Frank sees Warren looking down between the ties. He watches Warren cross the bridge and disappear into the rain; this chapter establishes neither a capture nor Warren’s responsibility for Ariel’s absence.</p></details><details><summary>Ordinary Grace · Chapter 22</summary><h2>Chapter 22</h2><p>Judy confirms Engdahl’s account, though Gregor retains doubts. As the family waits with help from neighbors and Liz, Nathan condemns threats and damage to the O’Keefes’ home and challenges Oscar’s prejudice.</p></details><details><summary>Ordinary Grace · Chapter 22</summary><h2>Chapter 22</h2><p>After learning that Danny is with relatives, Frank and Jake race driftwood boats along the swollen river. At the trestle, Jake notices red in the debris. Frank sends him for Nathan, recognizing dress fabric and Ariel’s auburn hair in the water, and remains crying above it.</p></details><details><summary>Ordinary Grace · Chapter 23</summary><h2>Chapter 23</h2><p>Ariel’s death and the retrieval of her body are confirmed. The family’s grief takes different forms: Ruth draws the curtains, Jake refuses prayer, and Frank fears the implications of having let Warren escape.</p></details><details><summary>Ordinary Grace · Chapter 23</summary><h2>Chapter 23</h2><p>After a restorative ride with Gus, Frank hears Doyle relay a preliminary view that Ariel was struck and thrown into the river, with a full autopsy sought. Doyle also says Engdahl and his girlfriend have disappeared. Later Nathan goes to the church and voices self-blame; Gus rejects the punitive explanation and holds him while he cries.</p></details><details><summary>Ordinary Grace · Chapter 24</summary><h2>Chapter 24</h2><p>Nathan preaches through his grief, urging faith, hope and love and promising that beauty can become visible again. Gus and Travis respond aloud; Amelia touches her husband’s arm. Frank leaves feeling renewed, tells Jake he is his best friend, and hears Jake’s fear of another loss. Doing yard work brings the boys closer to their grandfather and deepens Frank’s appreciation of him and Liz. Doyle reports that Engdahl and Judy have been located in Sioux Falls. Frank suspects Engdahl, but the next day’s autopsy will change the family’s thinking; its findings are not yet given.</p></details><details><summary>Ordinary Grace · Chapter 25</summary><h2>Chapter 25</h2><p>Ruth leaves for Emil’s house, and Nathan takes Jake to speech therapy. Gregor questions Frank, whose answers mingle observation with assumptions about Ariel and Karl. The boys then listen through the church duct as Gregor reports that Ariel suffered head trauma but died by drowning, and that she was five or six weeks pregnant. Gregor’s suspicions of Warren and Engdahl have weakened. He plans to question Karl after hearing of an argument with Ariel; the pregnancy’s paternity and the argument’s subject remain unestablished.</p></details><details><summary>Ordinary Grace · Chapter 26</summary><h2>Chapter 26</h2><p>Frank and Jake disobey Nathan and follow him to the Brandt farmhouse. Lise confronts them angrily but then weeps in Jake’s arms. Jake explains her distress as fear of losing her brother’s attention and her home; the boys garden with her. At home, Oscar threatens Karl, Ruth condemns the Brandts, and Liz urges hearing Karl’s account. Nathan plans a meeting and insists that involvement in Ariel’s death is still unknown. He asks the boys to withhold judgment and avoid rumors, while Frank privately remains furious.</p></details><details><summary>Ordinary Grace · Chapter 27</summary><h2>Chapter 27</h2><p>Rumors spread as the Brandt family keeps Karl out of sight. Nathan and Ruth are refused entry to the mansion. The sheriff reports that Karl, interviewed with a lawyer present, neither confirms nor denies responsibility for the pregnancy and maintains his earlier account. Gus relays Doyle’s report that the county attorney has declined to seek a search warrant for a possible weapon because of insufficient evidence. Ruth becomes increasingly withdrawn and hostile, refuses funeral planning, and asserts Karl’s guilt despite Nathan’s continued caution.</p></details><details><summary>Ordinary Grace · Chapter 28</summary><h2>Chapter 28</h2><p>When Ruth does not return from a walk, Nathan and Oscar search by car. The boys find her on the trestle, and Frank sends Jake back for help. Ruth weeps, rejects faith in God, embraces Frank and asks for his secret help. At 2:35 a.m. Frank cycles to the Brandt estate, sees preexisting accusing graffiti, climbs inside and carries out the still-undisclosed request. Doyle stops him, assumes responsibility for the graffiti, endorses it and takes Frank home, demanding secrecy.</p></details><details><summary>Ordinary Grace · Chapter 29</summary><h2>Chapter 29</h2><p>Frank explains to Jake that Ruth had him deliver an unopened envelope to Karl’s car. Karl arrives with its sheet music, and Ruth sings Unforgettable, the duet he once performed with Ariel. He denies killing her or sleeping with her and admits his talk to friends was empty boasting. Axel and Julia intervene. Julia makes hostile accusations about Ariel and insults the Drum children; Axel apologizes and takes her away. Nathan cautions against the town’s hostility, while Ruth insists the Brandts conceal something. Their argument over faith ends with Ruth asking to stay with Oscar and Liz.</p></details><details><summary>Ordinary Grace · Chapter 30</summary><h2>Chapter 30</h2><p>Ruth leaves to stay with Oscar. The boys seek Gus, then open the drapes and let sunlight into the house. Gus takes them to Ginger French’s ranch for a gentle horseback ride. Ginger, a Kentucky-raised widow who runs the property herself, has a warm relationship with Gus and credits his help there. Back home he makes dinner with the boys, invites Nathan to share a beer, and for a while all four talk, laugh and feel happy.</p></details><details><summary>Ordinary Grace · Chapter 31</summary><h2>Chapter 31</h2><p>Karl confides in Nathan that he is gay, ashamed and afraid of exposure. Nathan responds with acceptance and promises confidence, affirming that he does not believe Karl killed Ariel. Karl says his argument with Ariel concerned his suggestion of abortion, which she rejected; he says she never told him who fathered the child. Frank and Jake overhear, then disclose everything under Doyle’s pressure. Later Jake recognizes his own fear of ridicule in Karl’s. Frank rejects the slur, accepts Karl’s difference and account, and wants to become kinder, while feeling guilty for his brief happiness earlier that day.</p></details><details><summary>Ordinary Grace · Chapter 32</summary><h2>Chapter 32</h2><p>On visitation Friday, the boys hear Karl’s private disclosure circulating as barbershop gossip. Its reported chain leads from a police officer through Halderson to Baake; Frank suspects Doyle. They find Gus digging Ariel’s grave at the cemetery. He listens, accepts some responsibility for the duct and sends them to confess to Nathan, saying he will deal with Doyle. Nathan prioritizes reaching Karl. Blake then calls to report Gus jailed for assaulting Doyle, until Monday’s court. Frank, wanting Gus to finish the grave, proposes freeing him.</p></details><details><summary>Ordinary Grace · Chapter 33</summary><h2>Chapter 33</h2><p>The boys persuade the police to release Gus temporarily to finish Ariel’s grave. Unexpectedly, Doyle presses Blake to allow it; Gus promises to return within the permitted two hours. Nathan has still been unable to reach Karl. At the visitation Ruth seems fragile and promises to come back, while Frank fears the family is slipping apart. Outside, Jake shares his fears and the comfort of talking to Ariel; Frank keeps his own secret about Warren’s escape. During the night Nathan receives the sheriff’s call and tells Frank that Karl is dead. No cause or circumstances are yet disclosed.</p></details><details><summary>Ordinary Grace · Chapter 34</summary><h2>Chapter 34</h2><p>Ariel is buried on Saturday. Frank now knows Karl died after crashing his Triumph while drinking, but whether the crash was intentional remains unknown. Jake speaks of inescapable difference, thoughts of suicide under ridicule, and fear of dying. Frank recoils from those thoughts while struggling with his own guilt over the disclosure. Conrad Stephens conducts the funeral arranged by Nathan. Frank withdraws mentally, finds no hoped-for peace at the grave and cries as the family leaves. Nathan reaches for Ruth’s hand as both cry; Jake’s dry eyes puzzle Frank.</p></details><details><summary>Ordinary Grace · Chapter 35</summary><h2>Chapter 35</h2><p>At the meal after the burial, Peter offers friendship and tells Frank that his father is teaching him about motors. Ruth asks Nathan for an ordinary grace. When he invites someone else to pray, Jake volunteers, initially stumbles, and then—with Ruth’s hand on his shoulder—offers a brief fluent blessing. Ruth comes home that night. Frank understands the grace as a miracle and hope for the family’s survival, while the retrospective account makes clear that grieving continues.</p></details><details><summary>Ordinary Grace · Chapter 36</summary><h2>Chapter 36</h2><p>Sunday brings restored routines: Nathan preaches, Ruth leads the choir, and Gus attends after Doyle helps avoid charges. Frank begins thinking about forgiveness. The family renews contact with Emil, who reports Julia’s severe distress, discourages visiting the other Brandts and says he cannot continue his memoir without Ariel. While Jake helps Lise garden, Frank tests the path from the farmhouse to the river with his eyes closed. Its proximity to Sibley Park leads him to a new conviction about Ariel’s death; the chapter does not confirm that inference.</p></details><details><summary>Ordinary Grace · Chapter 37</summary><h2>Chapter 37</h2><p>Frank tells Jake he believes Emil fathered Ariel’s child and killed her, using the path test and her changed plans as his reasoning. These remain accusations and inference. Jake rejects more killing and describes his renewed faith and freedom from fear as ordinary miracles. Gus considers the theory worth bringing to Nathan. Nathan agrees to speak to Emil and allows Frank to accompany him on a promise of silence, while warning that they know only part of the story. Gus and Jake are sent to keep Ruth company at the piano.</p></details><details><summary>Ordinary Grace · Chapter 38</summary><h2>Chapter 38</h2><p>Emil admits a single sexual encounter with Ariel, describes her hopes of marriage and says his recent suicide attempt was meant to free her from him. He says he had not known of the pregnancy. He reports that Lise saw Ariel’s nighttime visits and says Ariel promised to stop. He denies killing her; Nathan believes him but ends their friendship and requires him to tell Ruth. Nathan tells Frank the family will move to Saint Paul. Frank feels pity for Emil, returns to his unproven belief in Warren’s guilt and finally confesses letting Warren escape. Nathan responds with an embrace and a desire to leave anger behind.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>Chapter 39</h2><p>As the move approaches, Danny’s family leaves for Granite Falls, Gus spends more time at Ginger’s ranch, and Engdahl dies in a drunken fall at the cannery. The day before departure, Frank and Jake help Lise build a garden wall. Seeking a Band-Aid in the shed, Frank finds Ariel’s watch and barrette. Jake admits he had suspected Lise but hoped to avoid punishment for her. Frank insists that Warren must not remain under suspicion and says he will tell Emil. Lise attacks him with the crowbar; Jake intervenes. She raises it over Jake but then lowers it, kneels and apologizes. Jake stays with her as injured Frank carries the belongings toward the porch.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>Epilogue</h2><p>In the present, Frank, now a history teacher, takes his elderly father to meet Jake, a Methodist pastor, for their annual cemetery visit. The retrospective account explains that Lise encountered Ariel on the lawn, remembered a bloodied crowbar after being touched, then carried her to the river in panic. She claimed no memory of the actual killing and spent her remaining life in the security hospital, visited by Emil and never abandoned by Jake. Frank later met Warren and recognized that he had wrongly condemned him. Gus and Ginger married and later died in a plane crash; Ruth died at sixty, lovingly cared for by Nathan. The visit closes on shared love and the continuing presence of the dead in memory, while the narrator acknowledges the limits and differences of recollection.</p></details></noscript>
