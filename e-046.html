      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 12</summary><h2>The buried collection</h2><p>Frank finds a tin about a foot high and eight inches wide buried at Warren’s shelter, covered by a white rag and rubber band.</p></details><details><summary>Ordinary Grace · Chapter 12</summary><h2>The buried collection</h2><p>It holds a rolled Playboy, damaged Mickey Mouse wristwatch, small ceramic frog, buckskin-clad doll, scrimshaw-decorated ivory comb and Purple Heart. Frank identifies the glasses and photograph as those associated with Bobby and the dead man respectively; this does not establish how the objects reached the tin. Jake’s question about finding them remains unresolved.</p></details><details><summary>Ordinary Grace · Chapter 20</summary><h2>Removed before the boys return</h2><p>Frank finds an empty hole where the can was buried. He tells Warren the police have it, but that custody has not been established. Warren says the objects were found or given to him.</p></details><details><summary>Ordinary Grace · Chapter 25</summary><h2>A different assessment of the objects</h2><p>Gregor considers the camp objects compatible with things found by tracks, riverbanks or alleys. His assessment supports a possibility rather than documenting each object’s acquisition.</p></details></noscript>
