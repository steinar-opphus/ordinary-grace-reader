      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 7</summary><h2>Introduction</h2><p>Emil and Lise share a renovated farmhouse at the western edge of New Bremen, overlooking the river.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Garden and porch</h2><p>Emil and Lise share a renovated farmhouse on the western edge of New Bremen overlooking the river, enclosed by a white picket fence. Lise plants red and yellow butterfly bushes along the fence and creates flower islands edged with red brick. Nathan moves Emil’s chess pieces as they play on the porch.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>Rooms shaped around music and flowers</h2><p>The interior has bare walls, little widely spaced furniture, and flowers arranged in vases throughout the rooms. Ariel says the furniture is kept fixed because of Emil’s blindness. A grand piano fills what Frank thinks was the former dining room, with reel-to-reel recording equipment nearby; the living room has large hi-fi speakers and shelves of records.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>Rooms shaped around music and flowers</h2><p>The kitchen opens to a deck with garden and river views.</p></details><details><summary>Ordinary Grace · Chapter 36</summary><h2>The route to the river</h2><p>A path leads through cottonwoods, across the railroad roadbed and down to sand by the river, only a few hundred yards from Sibley Park’s bonfire beach. Frank tests it with his eyes shut and steps calf-deep into water before looking. The test changes his suspicions; it does not prove another person used that route.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>The garden wall and the cabinet</h2><p>The boys help Lise build a roughly foot-high stone wall around a circular flower bed with a central birdbath between tall hackberries. Her shed is neatly organized with garden and hand tools, a vise-equipped workbench and a honey-coloured cabinet painted with flowers. Its middle drawer holds Ariel’s missing watch and barrette among the hardware.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 11</summary><p><a href="assets/7c940459b5055f.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the farmhouse’s rooms of music and flowers (chapter 11).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 36</summary><p><a href="assets/140065e01f0af2.jpg">Open noncanonical illustration</a></p><p>Frank tests where the farmhouse path reaches the river.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 7</summary><p><a href="assets/925f6280f1bc00.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the farmhouse garden.</p></details></noscript>
