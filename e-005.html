      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 1</summary><h2>Introduction</h2><p>Gus lives beside the boiler in the church basement.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Room and motorcycle</h2><p>A little red rug brightens the cement floor of his room. His motorcycle is a 1953 Indian Chief with a sidecar.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>The fight at Rosie’s</h2><p>Doyle says Gus and Engdahl argued at Rosie’s before taking their confrontation outside. Gus says Engdahl had insulted Bobby Cole and said he was better off dead. As he falls asleep after being brought home, Gus blames the man he calls Captain for unspecified deaths; this is an unexplained accusation, not an established account.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Family responses</h2><p>Frank says he and Jake liked Gus immensely, while Gus’s presence caused disagreement between their parents.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Remembering Bobby at the coffin</h2><p>At the funeral he wears a dark secondhand suit with his tie askew. He strokes Bobby’s coffin while crying. He says Bobby helped him care for the cemetery, whispered to headstones and found happiness easily. He criticizes the hurtful mockery Bobby received from Christians. Gus has dug the grave.</p></details><details><summary>Ordinary Grace · Chapter 8</summary><h2>Poker and a breached confidence</h2><p>Gus plays poker in the basement with Halderson, Ed Florine and Doyle, asking the boys not to tell Nathan. He stops Doyle’s eavesdropping on the Sweeneys’ consultation when he returns from the bathroom.</p></details><details><summary>Ordinary Grace · Chapter 9</summary><h2>Accepting responsibility on the evening walk</h2><p>Gus tells Frank he has informed Nathan about the afternoon, then apologizes and accepts responsibility for letting Frank down. When Frank asks about the war, Gus refuses to tell Nathan’s story for him and warns that other people’s accounts cannot be Nathan’s own truth. He sits beside Frank near the river as Frank renounces fireworks.</p></details><details><summary>Ordinary Grace · Chapter 23</summary><h2>A ride and returning the comfort</h2><p>Gus takes Frank for a ride that brings temporary relief, then explains that Nathan asked him not to reveal the disturbing information. At the church he challenges Nathan’s self-blame, rejects a punitive explanation for Ariel’s death and holds his crying friend.</p></details><details><summary>Ordinary Grace · Chapter 27</summary><h2>Passing on Doyle’s report</h2><p>Gus tells Ruth that, according to Doyle, the county attorney declined to seek a search warrant for a possible weapon because the evidence was insufficient. The tire iron remains a possibility, not an identified weapon. Asked about killing, Gus says his wartime victims were distant shapes rather than faces.</p></details><details><summary>Ordinary Grace · Chapter 30</summary><h2>A wider life and a welcome meal</h2><p>Gus welcomes the boys as always and takes them to Ginger French’s ranch. He earns a living from varied odd jobs around the county; the visit reveals his haying work and irrigation invention as well as his affectionate relationship with Ginger. Back home he cooks potatoes and eggs with Spam and cheddar, puts the boys to work helping, and persuades Nathan to share a beer. For a time all four enjoy talking and laughing together.</p></details><details><summary>Ordinary Grace · Chapter 32</summary><h2>Beneath the linden</h2><p>The boys find Gus digging Ariel’s grave beneath a linden. He has described gravedigging as carefully receiving something precious and claims a Missouri family tradition; Frank cautions that his stories are not always reliable. Gus takes the boys into the shade to hear about the disclosure, accepts blame for showing them the duct and tells them to confess to Nathan. He says he will deal with Doyle. Later Blake reports Gus held for assault after fighting Doyle and unable to leave before Monday’s court.</p></details><details><summary>Ordinary Grace · Chapter 33</summary><h2>Two hours to finish the grave</h2><p>The boys plead for Gus to finish Ariel’s grave. Doyle urges his temporary release, and Gus, now also sporting a black eye, promises to return. Blake allows two hours; Doyle returns the motorcycle key and offers help. Gus promises the boys a grand grave and rides away.</p></details><details><summary>Ordinary Grace · Chapter 37</summary><h2>Taking the suspicion to Nathan</h2><p>Gus says Frank’s theory is worth considering, accompanies the boys to Nathan and supports Frank’s request to attend the conversation with Emil. Nathan sends Gus and Jake to keep Ruth company instead, to avoid making Emil feel ganged up on.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>A change of habits</h2><p>As departure nears, Gus spends more time helping Ginger at her ranch. He reduces his drinking and no longer spends time with Doyle.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>Marriage and adventures with Ginger</h2><p>Gus and Ginger marry a year after the Drums move. They enjoy motorcycle travel, learn to fly and buy a Piper Cub. Twelve years into the marriage, severe weather brings their plane down in a cornfield while bound for Valentine, Nebraska, killing them both. Nathan gives their funeral eulogy; the family visits their graves each year.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>Appearance</h2><p>Gus has red hair.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Background</h2><p>He fought alongside Frank’s father in the Second World War and later received a home and work through him.</p></details><details><summary>Ordinary Grace · Chapter 30</summary><h2>Personality</h2><p>Frank values his consistently welcoming response to the boys.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 2</summary><p><a href="assets/946cd40205103a.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Gus beside the coffin at the funeral (chapter 2).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 8</summary><p><a href="assets/9af9504aca05f2.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the basement poker game and listening through the duct (chapter 8).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 9</summary><p><a href="assets/252a6e10723876.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Gus and Frank beside the river after their evening conversation (chapter 9).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 23</summary><p><a href="assets/38c9039fa73ef6.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Gus comforting Nathan at the altar (chapter 23).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 30</summary><p><a href="assets/e3939d2cda314c.jpg">Open noncanonical illustration</a></p><p>Ginger and Gus lead the boys along the creek.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 32</summary><p><a href="assets/5032b833f3e768.jpg">Open noncanonical illustration</a></p><p>Gus hears the boys’ account in the shade of the linden.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 33</summary><p><a href="assets/f45a27a3273c16.jpg">Open noncanonical illustration</a></p><p>Doyle returns Gus’s motorcycle key for the temporary release.</p></details></noscript>
