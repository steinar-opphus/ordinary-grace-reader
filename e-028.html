      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 5</summary><h2>Introduction</h2><p>Emil Brandt is Ariel’s music teacher and Ruth’s childhood friend.</p></details><details><summary>Ordinary Grace · Chapter 5</summary><h2>Teaching and an earlier engagement</h2><p>Frank says Ruth was briefly engaged to Emil when young, before he left her to seek his fortune in New York.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>War, family and the chess visit</h2><p>Emil and Lise are Axel’s siblings and Karl’s uncle and aunt. He plays chess with Nathan, who moves his pieces. During their discussion he calls Ariel a gifted composer, and later wins when Nathan resigns.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>The Sunday crisis</h2><p>Gus reports that Emil tried to kill himself. A fireman’s account, relayed through Jake, suggests sleeping pills; the motive and exact circumstances are not established. Lise will not leave the hospital, and Nathan asks Jake to help her go home until Emil can return.</p></details><details><summary>Ordinary Grace · Chapter 12</summary><h2>An accident account and a private admission</h2><p>Emil returns after hospital care in the Twin Cities. He calls the incident an accident to Ariel and says to Nathan that he drank too much scotch and took too many pills. Nathan challenges the account; Emil then says he lacks courage to try again but declines to explain the burden behind it.</p></details><details><summary>Ordinary Grace · Chapter 15</summary><h2>The rehearsal and Ruth’s promise</h2><p>Emil takes part in rehearsal after his hospitalization. He recalls composing for Ruth’s sixteenth birthday and speaks of moments of darkness. She promises support; he covers her hand at his cheek and tells her he loves her.</p></details><details><summary>Ordinary Grace · Chapter 16</summary><h2>Renewed inspiration reported and an earlier attempt</h2><p>Ariel reports that Emil says he is ready to compose again; Ruth remains skeptical because of his recent darkness. During their argument Ariel says his memoir records an earlier suicide attempt. Ruth says he had never told her. The disagreement does not establish the cause of either crisis.</p></details><details><summary>Ordinary Grace · Chapter 36</summary><h2>Friendship renewed and work suspended</h2><p>Ruth and Nathan renew their friendship with Emil after he attended Ariel’s funeral. He says he had feared the estrangement would never end. He reports Julia’s threats of suicide and sedation, citing Axel, and discourages contact with them as complicated. Asked about the memoir, he says he cannot go on without Ariel and does not want someone else to transcribe.</p></details><details><summary>Ordinary Grace · Chapter 37</summary><h2>Frank’s new suspicion</h2><p>Frank accuses Emil of fathering Ariel’s child and killing her, reasoning from her changed plans and the accessible river path. His imagined disposal scene is not an observation. Nathan decides to speak with Emil while insisting the theory remains incomplete and judgment premature.</p></details><details><summary>Ordinary Grace · Chapter 38</summary><h2>An admission and a broken friendship</h2><p>Emil admits a single sexual encounter with Ariel, saying she loved him and wanted marriage, while he relied on her and was reminded of Ruth. He says he tried to dissuade her and believed Lise could not accept another person sharing his affection. He explains the recent suicide attempt as an attempt to free Ariel from him and confirms an earlier attempt after his wartime wounds. He says he did not know of the pregnancy, hoped Karl was the father, and had learned of Ariel’s nighttime watching from Lise. He denies killing her and assumes Lise would have mentioned a visit that last night. Nathan believes the denial but asks him to tell Ruth and says he has no wish to see him again.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>Visits and an early death</h2><p>Emil continues visiting Lise at the security hospital until his death at fifty-one. They are buried beside one another.</p></details><details><summary>Ordinary Grace · Chapter 7</summary><h2>Appearance</h2><p>Ariel’s account says Emil returned from war blind and disfigured. Thick scar tissue covers his left cheek while the right side is unscarred.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 15</summary><p><a href="assets/dd89ad0b70b096.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the gesture of support after rehearsal (chapter 15).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 5</summary><p><a href="assets/f63b355d67089d.jpg">Open noncanonical illustration</a></p><p>Emil Brandt, Ariel’s music teacher.</p></details></noscript>
