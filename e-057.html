      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 30</summary><h2>Introduction</h2><p>Ginger French runs a ranch in a small valley.</p></details><details><summary>Ordinary Grace · Chapter 30</summary><h2>Appearance</h2><p>She is tall and willowy, with long straight brown hair. At the first meeting she wears a light-blue Western-style pearl-snap shirt and black riding boots.</p></details><details><summary>Ordinary Grace · Chapter 30</summary><h2>Kentucky and the ranch</h2><p>Raised in Kentucky, she moved west with her husband. After his death from a heart attack two years earlier, she moved permanently to the ranch and runs it herself. She says she attends the Kentucky Derby annually.</p></details><details><summary>Ordinary Grace · Chapter 30</summary><h2>Welcoming the boys</h2><p>She greets Gus affectionately, guides a slow ride so the boys can know their mounts, and serves lemonade and cookies. Her kisses and warm manner show a relationship beyond what Frank had known of Gus’s life.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>A shared life of travel</h2><p>Ginger marries Gus a year after the Drums leave. She enjoys riding on his Indian Chief; both later learn to fly and own a Piper Cub. They die twelve years into marriage in a severe-weather crash en route to Valentine, Nebraska. Nathan delivers the funeral eulogy.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 30</summary><p><a href="assets/e8d0f72fb266c7.jpg">Open noncanonical illustration</a></p><p>Ginger French in riding clothes.</p></details></noscript>
