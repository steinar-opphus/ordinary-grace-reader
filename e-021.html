      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 1</summary><h2>Introduction</h2><p>Frank’s grandfather gave the family their Packard.</p></details><details><summary>Ordinary Grace · Chapter 3</summary><h2>Work and family</h2><p>He works in real estate.</p></details><details><summary>Ordinary Grace · Chapter 22</summary><h2>Oscar and the harassment</h2><p>Nathan addresses him as Oscar. During the dispute over the O’Keefes, Oscar responds to Warren’s explanation with a racist generalization. Nathan condemns the harassment as prejudice and cruelty.</p></details><details><summary>Ordinary Grace · Chapter 24</summary><h2>Sunday on the porch</h2><p>The boys do their usual yard work on Sunday. Oscar compliments it and gives each ten dollars instead of two. Frank recognizes both his faults and his love for his family, and looks at him with new affection.</p></details><details><summary>Ordinary Grace · Chapter 26</summary><h2>Anger toward Karl</h2><p>After learning of Ariel’s pregnancy, Oscar threatens Karl. Nathan refuses to include him in the parents’ planned meeting with the Brandts.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>Remembered beside his two wives</h2><p>Oscar and Liz have been dead nearly twenty years in the present. His grave lies between Frank’s grandmother and Liz, and the family places flowers for all three.</p></details></noscript>
