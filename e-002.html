      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Prologue</summary><h2>Introduction</h2><p>The narrator recalls a defining summer four decades later.</p></details><details><summary>Ordinary Grace · Prologue</summary><h2>Remembering Bobby</h2><p>He regrets not having been a better friend to Bobby Cole.</p></details><details><summary>Ordinary Grace · Prologue</summary><h2>Perspective</h2><p>He describes a summer of deaths by accident, nature, suicide and murder, and recalls his father quoting Aeschylus about suffering and wisdom.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>The night at the jail</h2><p>The narrator is called Frank and is thirteen during the visit. His younger brother is Jake. Frank admits lying to Doyle about playing on the tracks. Later he smashes Engdahl’s headlights.</p></details><details><summary>Ordinary Grace · Chapter 2</summary><h2>A torn coat and an unspoken memory</h2><p>Frank spies through the Sweeneys’ fence and tears Jake’s suit coat while pulling him away. He uses sewing learned as a Boy Scout to repair it. At Bobby’s funeral he finds death frightening; his mother’s singing almost makes him believe in heaven. He thinks of speaking but remains silent.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>Concealment and the storm</h2><p>Frank omits the stranger from his account to the sheriff. Later, watching an electrical storm pass north of the valley from the porch, he sees someone leave the house toward the Heights.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>An apology after embellishment</h2><p>Frank inflates Jake’s rescue role, provoking Jake’s demand for truth. After Jake flees the church, Frank apologizes. At the hospital he recognizes that his earlier heroic account had stretched the truth.</p></details><details><summary>Ordinary Grace · Chapter 12</summary><h2>Opening and reburying the collection</h2><p>Frank uncovers the tin at Warren’s deserted shelter and identifies glasses and the dead man’s photograph among its contents. He replaces it and sweeps away their traces, copying the concealment he witnessed earlier.</p></details><details><summary>Ordinary Grace · Chapter 13</summary><h2>A name and a different history</h2><p>Frank introduces himself as Frank Drum and says the surname is Scottish. He hears Warren’s account of the Dakota conflict and recognizes its difference from his schooling.</p></details><details><summary>Ordinary Grace · Chapter 14</summary><h2>Rescue followed by another push</h2><p>Frank charges Engdahl into the quarry and, with the companion, pulls him back using Jake’s branch. After Engdahl threatens and releases him, Frank pushes him into the water again and escapes with the others behind a spoil pile.</p></details><details><summary>Ordinary Grace · Chapter 20</summary><h2>Calling out in the storm</h2><p>Frank finds the tin missing and tells Warren that police have it, without an established account of its removal. He calls out Warren’s location when sirens approach. The retrospective narrator says the look of understanding in Warren’s eyes still makes him ashamed; the later consequences are not explained here.</p></details><details><summary>Ordinary Grace · Chapter 21</summary><h2>Regret and the reversed encounter</h2><p>Frank’s anger gives way to regret and agreement with Jake’s belief that Warren did not hurt Ariel. He follows the pursuit despite the order to wait, runs ahead of Jake and stops at the trestle. This time Warren’s face looks down from above; Frank watches him cross and disappear.</p></details><details><summary>Ordinary Grace · Chapter 22</summary><h2>Silence, sympathy and recognition</h2><p>Frank keeps silent about seeing Warren escape. During the waiting he prays but feels as if he is speaking to air without an answer. Later he exchanges sympathy with Danny’s mother before walking the swollen river with Jake. When he recognizes the dress and Ariel’s hair below the trestle he sends Jake for Nathan and remains crying.</p></details><details><summary>Ordinary Grace · Chapter 23</summary><h2>Relief on the road and fear of the truth</h2><p>Frank fears his part in Warren’s escape if Ariel was killed. A countryside ride with Gus brings temporary relief, but Doyle’s preliminary-report account renews his fear; he is angry that information was withheld.</p></details><details><summary>Ordinary Grace · Chapter 24</summary><h2>Learning to continue</h2><p>Frank receives the sermon as a miracle and tells Jake he is his best friend. He proposes that they keep doing familiar things until life feels right again. Yard work and his grandfather’s generosity help him see the older man more affectionately; he cannot know whether Oscar has changed or his own understanding has. He takes hope from remembering Bobby’s father still appreciating a beautiful evening.</p></details><details><summary>Ordinary Grace · Chapter 25</summary><h2>The limits of his testimony</h2><p>Frank tells Gregor about Ariel’s secret outings and his impression that her affection for Karl was unequal. He recognizes that he has exaggerated his knowledge of her confidences: what feels true is not necessarily known. Later he removes the rags from the furnace duct and eavesdrops with Jake on the autopsy disclosure.</p></details><details><summary>Ordinary Grace · Chapter 26</summary><h2>Resentment and rage</h2><p>Frank resents being denied the adults’ knowledge and follows Nathan despite orders. He feels betrayed by the belief that Emil has been informed first. At night he says he hates the Brandts; despite agreeing to avoid judgment and rumor, he privately imagines he might be capable of killing.</p></details><details><summary>Ordinary Grace · Chapter 28</summary><h2>A secret errand for his mother</h2><p>Frank stays with Ruth on the trestle and sends Jake back for help. Although he remembers Nathan’s grief and sermon, he stays silent and agrees to her secret request. Later he slips out at 2:35 a.m., finds graffiti already on the Brandt gate, and climbs in to perform the undisclosed task. Doyle stops him, apparently assumes he painted it, and sends him home under a threat of secrecy. Frank feels uncomfortable with the officer’s endorsement of the accusation.</p></details><details><summary>Ordinary Grace · Chapter 29</summary><h2>The letter’s contents revealed</h2><p>Frank tells Jake he delivered an unopened envelope to Karl’s windshield for Ruth. Karl’s visit reveals its contents as sheet music. Seeing the young man at the piano, Frank revises his impression of confident maturity and sees a vulnerable child instead.</p></details><details><summary>Ordinary Grace · Chapter 30</summary><h2>Opening the drapes</h2><p>After Ruth leaves, Frank and Jake throw open the drapes she kept closed. The sunlight feels liberating. A ride at Ginger’s ranch brings Frank pleasure in the summer landscape, and Gus’s dinner gives the household a brief interval of happiness.</p></details><details><summary>Ordinary Grace · Chapter 31</summary><h2>Wanting to be kinder</h2><p>Frank feels guilty for having briefly forgotten Ariel while enjoying the ranch and dinner. After the boys surrender Karl’s confidence under Doyle’s pressure, Jake’s empathy prompts Frank to consider how much bullying his brother has endured. He rejects the slur, accepts Karl’s difference and says he believes his account about Ariel. He wants desperately to be a better person.</p></details><details><summary>Ordinary Grace · Chapter 32</summary><h2>A confession and a new plan</h2><p>Frank hears Karl’s private disclosure made into gossip. Baake cites Halderson’s police source; Frank suspects Doyle and feels responsible. The cemetery now feels alienating rather than peaceful. He tells Gus and then Nathan about the eavesdropping and Doyle’s pressure. When Blake calls about Gus’s arrest, Frank wants Gus himself to finish Ariel’s grave and proposes freeing him.</p></details><details><summary>Ordinary Grace · Chapter 33</summary><h2>Ritual and unspoken guilt</h2><p>At the visitation Frank fears the family is losing one another. Looking back, he values ritual as a support that keeps grieving people connected. He sometimes enters Ariel’s room to smell the perfume Oscar and Liz gave her at sixteen, but nightmares about Warren and guilt over letting him escape remain private.</p></details><details><summary>Ordinary Grace · Chapter 34</summary><h2>No promised peace</h2><p>Frank fears the town will remember cruel labels rather than the truth of Ariel and Karl. He worries about responsibility for Karl’s death if the crash was intentional, but this is guilt rather than established causation. He distances himself during the funeral, finds only grief at the grave and cries at leaving Ariel there.</p></details><details><summary>Ordinary Grace · Chapter 35</summary><h2>The gift he remembers</h2><p>Peter’s invitation makes Frank recognize that he had once regarded his own family as special and indestructible. Later Jake’s short blessing changes the day for him. He remembers every word four decades later and understands it as a miracle and a sign of family survival, rather than an explanation for the deaths.</p></details><details><summary>Ordinary Grace · Chapter 36</summary><h2>A path tested without sight</h2><p>Frank’s anger begins to recede as he recognizes the people he still loves and considers forgiveness. Visiting Emil, he recognizes the older man’s grief, then conceives a new possibility. He closes his eyes and follows the path from the farmhouse through cottonwoods, across the tracks and into the river. Its proximity to Sibley Park makes him believe he understands how Ariel entered the water. This is his conviction at the chapter’s end, not independent confirmation.</p></details><details><summary>Ordinary Grace · Chapter 37</summary><h2>A theory hardened into accusation</h2><p>Frank tells Jake he believes Emil fathered Ariel’s child and killed her. He reasons from her changed plans and his path test, and imagines a disposal scene he never witnessed. His anger rises to a threat of killing Emil. Gus considers the theory worth taking to Nathan, who agrees to a discussion but warns against judgment before all facts are known. Frank is permitted to attend only if he lets Nathan speak.</p></details><details><summary>Ordinary Grace · Chapter 38</summary><h2>Unburdening in the garage</h2><p>Emil’s admission does not make Frank feel better, but he no longer hates him and feels pity. Nathan tells him of the planned move to Saint Paul. Frank again concludes Warren killed Ariel, without new proof, and finally tells Nathan about letting him escape. Afraid of losing his father’s love, he instead receives an embrace and reassurance. Both express readiness to leave anger behind.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>The discovery before departure</h2><p>Frank finds Ariel’s watch and barrette while looking for a Band-Aid after cutting his finger in the shed. Jake admits his earlier suspicion of Lise. Frank argues that safety and Warren’s continued pursuit require disclosure, and feels his own guilt over Warren lift. When he says he will tell Emil, Lise attacks him; he twists an ankle while dodging. Jake intervenes, and after she lowers the crowbar Frank limps toward Emil carrying Ariel’s belongings.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>A historian’s return</h2><p>Frank becomes a high-school history teacher in Saint Paul, with a wife and grown children. Each Memorial Day he returns with Nathan and Jake to the New Bremen cemetery. He regards memory as a construction of surviving glimpses and imagined gaps, and notes the family’s different recollections and deliberate silences. His college-era reunion with Warren acknowledges the wrong of his earlier suspicion. At the graves, the surviving men find connection through love and history and the continuing memory of the dead.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Background</h2><p>He is thirteen during the summer’s opening visit to the jail.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Personality</h2><p>His early actions include lying about the tracks and retaliating against Engdahl’s car.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 1</summary><p><a href="assets/0fdad98382d413.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the brothers beside the damaged car after their retaliation (chapter 1).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 4</summary><p><a href="assets/7b165ef995ba0c.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Frank watching the distant electrical storm (chapter 4).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 14</summary><p><a href="assets/0482a3b8200f45.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the boys hiding with their bicycles (chapter 14).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 21</summary><p><a href="assets/e132dba2a1bc68.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the silent meeting at the trestle (chapter 21).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 22</summary><p><a href="assets/93d61811927925.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Frank after the recognition at the trestle (chapter 22).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 25</summary><p><a href="assets/e2660ad31ee1a0.jpg">Open noncanonical illustration</a></p><p>The brothers listen through the church’s furnace duct.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 28</summary><p><a href="assets/becec46fcc5997.jpg">Open noncanonical illustration</a></p><p>Ruth holds Frank beside the moonlit river.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 36</summary><p><a href="assets/140065e01f0af2.jpg">Open noncanonical illustration</a></p><p>Frank tests where the farmhouse path reaches the river.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 37</summary><p><a href="assets/a378bb337a0fe0.jpg">Open noncanonical illustration</a></p><p>The brothers speak about fear and ordinary miracles.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 38</summary><p><a href="assets/deef02bb55dab4.jpg">Open noncanonical illustration</a></p><p>Nathan reassures Frank after his confession.</p></details><details><summary>Illustration · Ordinary Grace · Epilogue</summary><p><a href="assets/a0897ea74b2afc.jpg">Open noncanonical illustration</a></p><p>Frank, Nathan and Jake share the annual cemetery visit.</p></details></noscript>
