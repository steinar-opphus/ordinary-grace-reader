      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 7</summary><h2>Introduction</h2><p>The cemetery stands on a hill on the east side of New Bremen.</p></details><details><summary>Ordinary Grace · Chapter 32</summary><h2>A hillside burial ground</h2><p>The cemetery stands on a hill on the east side of town. It looks over the green valley and has a wrought-iron boundary fence. Bobby’s grave still bears a mound and wilting bouquets. Ariel’s grave is prepared beneath a linden at the far end. Frank’s experience of grief changes the place from peaceful to unfamiliar and frightening; that description records his perception.</p></details><details><summary>Ordinary Grace · Chapter 34</summary><h2>A precise rectangle and a painful farewell</h2><p>At Ariel’s burial Frank sees the carefully straight walls and level floor of the completed grave, yet it remains only a hole to him. The precision cannot provide the peace he had hoped for.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>The annual circuit of remembrance</h2><p>Frank, Nathan and Jake return each Memorial Day. Their visits include Bobby, the unnamed itinerant, Karl, Engdahl, Emil and Lise, Oscar and his wives, and Ginger and Gus. Their final stop is beneath the linden beside Ariel and Ruth; Nathan plans to join them there.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 32</summary><p><a href="assets/5032b833f3e768.jpg">Open noncanonical illustration</a></p><p>Gus hears the boys’ account in the shade of the linden.</p></details></noscript>
