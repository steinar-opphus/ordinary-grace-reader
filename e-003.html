      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>Ordinary Grace · Chapter 1</summary><h2>Story and connections</h2><p>Jake is Frank’s younger brother, two years younger and markedly shorter.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>Appearance</h2><p>He has red hair, freckles and prominent ears, and is sometimes called Howdy Doody. Frank says Jake almost always stutters in public; with Frank he stutters when angry or afraid.</p></details><details><summary>Ordinary Grace · Chapter 1</summary><h2>A night of mockery and retaliation</h2><p>Morris Engdahl mocks Jake’s speech in the jail. Jake initially refuses to damage Engdahl’s car, then breaks a rear light with the tire iron. He also connects Bobby Cole’s death with release from being mocked.</p></details><details><summary>Ordinary Grace · Chapter 3</summary><h2>A river comparison and a plain answer</h2><p>Jake tells Frank that nobody is nobody when Frank dismisses Doyle. At the trestle Frank notices Jake speaking to the stranger without stuttering. Back at Halderson’s Jake supplies the answer Frank cannot give: a dead man.</p></details><details><summary>Ordinary Grace · Chapter 4</summary><h2>A best friend and a different judgment</h2><p>Jake calls Frank his best friend. He believes the stranger would not have harmed them, differing from Frank’s frightened reaction. He tells Ariel there were two men beneath the trestle.</p></details><details><summary>Ordinary Grace · Chapter 6</summary><h2>A protest about the retelling</h2><p>Jake objects that Frank’s account makes it sound as if he was not there when they found the body.</p></details><details><summary>Ordinary Grace · Chapter 8</summary><h2>Privacy and another possible explanation</h2><p>Jake suggests Warren might simply have found the glasses by the tracks. After the poker-room eavesdropping he says the Sweeneys’ conversation was private and they should not have listened.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>A rescue account and a difficult request</h2><p>Lise seeks Jake’s help when Emil is in danger. Gus takes them to the house on his motorcycle. Jake asks a fireman not to touch Lise and explains that strangers’ touch upsets her.</p></details><details><summary>Ordinary Grace · Chapter 10</summary><h2>A rescue account and a difficult request</h2><p>Later he objects to Frank’s exaggerated account, demands the truth and swears at the church doorway before fleeing home. At Nathan’s request he agrees to help Lise leave the hospital, walking toward Emil’s room between Nathan and Axel.</p></details><details><summary>Ordinary Grace · Chapter 11</summary><h2>Helping Lise return and work</h2><p>Jake succeeds in persuading Lise to leave the hospital, then agrees with Ariel to stay with her. After the garden incident he explains that Frank’s touch was accidental and asks that Lise be left to calm.</p></details><details><summary>Ordinary Grace · Chapter 23</summary><h2>Anger after the death</h2><p>After Ariel’s death Jake refuses prayer and will not bow his head for grace. Frank describes anger rather than treating this as a permanent statement of belief.</p></details><details><summary>Ordinary Grace · Chapter 24</summary><h2>Fear of another loss</h2><p>Jake fears that Frank will die too. Nothing feels right and he keeps expecting Ariel to visit their room. Frank offers companionship and the hope of familiar routines.</p></details><details><summary>Ordinary Grace · Chapter 25</summary><h2>Observation and astonishment</h2><p>Jake attends weekly speech therapy in Mankato. Frank admires his habit of quiet, accurate observation. Jake interprets Ruth’s anger at Nathan as anger at God; the older narrator comes to agree. After the brothers overhear the autopsy conversation, Jake speaks Karl’s name with anger and astonishment.</p></details><details><summary>Ordinary Grace · Chapter 26</summary><h2>Comforting Lise</h2><p>Jake stops when Lise confronts the boys and holds her as she cries. He interprets her distress for Frank and offers to help in the garden. Her willingness to accept his embrace is unprecedented in Frank’s experience.</p></details><details><summary>Ordinary Grace · Chapter 31</summary><h2>Recognizing the fear of ridicule</h2><p>After eavesdropping with Frank, Jake yields to Doyle’s pressure and discloses Karl’s sexuality with a word he does not understand. At night he connects Karl’s fear of exposure with his own fear that speaking will bring ridicule for his stutter. His empathy helps Frank rethink difference and bullying.</p></details><details><summary>Ordinary Grace · Chapter 33</summary><h2>The ways he holds on</h2><p>Jake fears that Ruth may come home without emotionally returning to them. He dreams of Ariel playing piano while Warren dances, and says that talking to Ariel helps even though he does not know whether she hears him. The dream and comfort are his experiences, not evidence about the dead or Warren. He also has an uncanny knack for finding four-leaf clovers.</p></details><details><summary>Ordinary Grace · Chapter 34</summary><h2>Fear before the funeral</h2><p>Jake says one cannot leave behind who one is. He fears lifelong ridicule for his stutter and admits that he sometimes thinks of killing himself. He asks about dying and says he cannot stop thinking about it; Frank does not want to face the question. Later Frank notices that Jake has not cried during the funeral day.</p></details><details><summary>Ordinary Grace · Chapter 35</summary><h2>An ordinary grace</h2><p>When Ruth asks for a simpler blessing and Nathan invites someone else to pray, Jake volunteers. He first stumbles, then tries again with Ruth’s hand on his shoulder and delivers a short, fluent grace thanking God for food, friends and family. Frank remembers every word and interprets the event as a divine gift and a sign that the family can survive; the chapter does not establish a permanent end to the stutter.</p></details><details><summary>Ordinary Grace · Chapter 37</summary><h2>No longer afraid</h2><p>Jake questions Frank’s accusation and rejects further killing. He values Ruth’s return and his fluent grace as ordinary miracles and expects he will not stutter again. Asked what his miracle felt like, he says he simply was no longer afraid. He acknowledges renewed belief in God and suggests entrusting the situation to God rather than pursuing more anger.</p></details><details><summary>Ordinary Grace · Chapter 39</summary><h2>Mercy, secrecy and intervention</h2><p>Jake’s stutter is described as gone after one further therapy visit; he and Ruth understand it as a miracle. He continues visiting Lise for companionship. When Frank finds Ariel’s belongings, Jake admits he had suspected Lise but was unsure. He hoped a blow might have been accidental, feared prison for her, and argues for forgiveness. Frank’s warning that Warren may suffer for the wrong suspicion persuades him to yield. When Lise attacks, Jake grabs her arm; after she lowers the crowbar over him, he kneels beside her without touching and promises to stay while Frank seeks Emil.</p></details><details><summary>Ordinary Grace · Epilogue</summary><h2>A ministry and lasting compassion</h2><p>Jake becomes a Methodist pastor in Winona, a tall, graceful man beginning to bald. He has a wife and grown children and joins Frank and Nathan for the annual cemetery visit. He never abandons Lise and prays beside her at her death. At the visit’s close he answers Nathan’s satisfaction with a quiet Amen.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 1</summary><p><a href="assets/0fdad98382d413.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of the brothers beside the damaged car after their retaliation (chapter 1).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 10</summary><p><a href="assets/6bde4e4696d9df.jpg">Open noncanonical illustration</a></p><p>Noncanonical interpretation of Jake going with Nathan and Axel to help Lise (chapter 10).</p></details><details><summary>Illustration · Ordinary Grace · Chapter 25</summary><p><a href="assets/e2660ad31ee1a0.jpg">Open noncanonical illustration</a></p><p>The brothers listen through the church’s furnace duct.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 26</summary><p><a href="assets/a4f463e78102de.jpg">Open noncanonical illustration</a></p><p>Lise accepts Jake’s comfort beside the garden.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 35</summary><p><a href="assets/43124d05772dc4.jpg">Open noncanonical illustration</a></p><p>Jake offers the grace with Ruth’s hand on his shoulder.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 37</summary><p><a href="assets/a378bb337a0fe0.jpg">Open noncanonical illustration</a></p><p>The brothers speak about fear and ordinary miracles.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 39</summary><p><a href="assets/aa6a5c4e47f128.jpg">Open noncanonical illustration</a></p><p>Jake remains beside Lise after she lowers the crowbar.</p></details><details><summary>Illustration · Ordinary Grace · Epilogue</summary><p><a href="assets/a0897ea74b2afc.jpg">Open noncanonical illustration</a></p><p>Frank, Nathan and Jake share the annual cemetery visit.</p></details><details><summary>Illustration · Ordinary Grace · Chapter 1</summary><p><a href="assets/7750493af193b0.jpg">Open noncanonical illustration</a></p><p>Jake, Frank’s red-haired younger brother.</p></details></noscript>
